name: Voltune Light Status Contrast Once

'on':
  push:
    paths:
      - '.github/workflows/voltune-light-status-contrast-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Light-Theme-Kontrastpatch anwenden
        run: python3 .github/scripts/voltune-light-status-contrast.py

      - name: Patch prüfen
        shell: bash
        run: |
          grep -q 'UI-FIX · Light Theme Status-Kontrast' voltune-dev/css/voltune.css
          git diff --check

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-light-status-contrast-once.yml
          rm .github/scripts/voltune-light-status-contrast.py
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/css/voltune.css .github/workflows/voltune-light-status-contrast-once.yml .github/scripts/voltune-light-status-contrast.py
          git commit -m "Light Theme Statusanzeigen besser lesbar machen" -m "Die Kontraste im Light Theme gezielt verbessert. Der Debug-Button erhält eine klar lesbare dunkle Beschriftung und einen deutlich sichtbaren aktiven Zustand. Die Betriebsstatus für GPS aktiv, GPS wartet/startet sowie GPS Fehler/gestoppt verwenden nun kräftigere Schrift-, Rahmen- und Hintergrundfarben mit besserem Kontrast. Dark Theme, Layout sowie Fahr-, Sound- und Triggerlogik bleiben unverändert."
          git push

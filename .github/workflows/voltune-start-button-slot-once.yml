name: Voltune Start Button Slot Once

on:
  push:
    paths:
      - '.github/workflows/voltune-start-button-slot-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start-Button strukturell ins Gang-Kästchen integrieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: JavaScript Syntax prüfen
        run: node --check voltune-dev/js/app.js

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-start-button-slot-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/index.html voltune-dev/js/app.js voltune-dev/css/voltune.css .github/workflows/voltune-start-button-slot-once.yml
          git commit -m "Start-Button sauber ins Gang-Kästchen integrieren" -m "Der große Start-Button wird vor dem ersten Benutzerstart strukturell in einen eigenen Slot innerhalb der Ganganzeige verschoben und verwendet wieder die ursprüngliche grüne Farbgebung. Dadurch richtet er sich ohne feste Pixelpositionen automatisch nach der Breite des Gang-Kästchens und bleibt auf Handy, Tesla-Browser und Desktop korrekt ausgerichtet. Nach erfolgreichem GPS-/Audio-Start wird derselbe Button zurück in die Steuerungsgruppe direkt über STOP verschoben und bleibt dort bis zum Neuladen. JavaScript-Syntax mit node --check geprüft."
          git push

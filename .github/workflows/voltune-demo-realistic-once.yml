name: Voltune Demo Realistic Once

on:
  push:
    paths:
      - '.github/workflows/voltune-demo-realistic-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Realistische Demo-Testfahrt integrieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: JavaScript Syntax prüfen
        run: node --check voltune-dev/js/app.js

      - name: Demo-Kennwerte prüfen
        shell: bash
        run: |
          python3 - <<'PY'
          # Plausibilitätscheck der im JS verwendeten Beschleunigungs-Schlüsselpunkte.
          keyframes = [
            (0.0,0.00),(2.5,0.00),(3.3,0.65),(5.7,0.65),(6.5,0.40),
            (7.5,1.30),(13.0,1.30),(14.5,0.00),(18.0,0.00),
            (19.0,1.71),(24.5,1.71),(25.5,0.00),(28.0,0.00),
            (28.7,2.60),(33.3,2.60),(34.0,0.00),(34.4,-0.12),(35.5,0.00),
            (39.0,0.00),(40.0,1.71),(45.5,1.71),(46.5,0.00),
            (46.9,-0.12),(48.0,-0.55),(49.0,-1.55),(52.2,-1.55),
            (53.0,-2.40),(54.0,-3.40),(58.0,-3.40),(59.0,-2.40),
            (60.0,-2.50),(65.0,-2.50),(66.0,-1.20),(67.0,-0.80),
            (70.0,-0.80),(71.5,0.00),(74.0,0.00),(74.9,1.60),
            (75.9,2.50),(81.0,2.50),(82.0,0.00),(82.4,-0.12),
            (83.0,0.00),(83.8,-1.50),(88.5,-2.70),(90.5,-1.50),
            (92.5,-0.70),(94.0,0.00),(97.0,0.00)
          ]
          def smooth(p):
              p=max(0,min(1,p)); return p*p*(3-2*p)
          def accel(t):
              for (t0,a0),(t1,a1) in zip(keyframes,keyframes[1:]):
                  if t <= t1:
                      p=(t-t0)/(t1-t0) if t1>t0 else 1
                      s=smooth(p)
                      return a0+(a1-a0)*s
              return 0
          dt=.02; speed=0; prev=accel(0); values={}
          checkpoints=[6.5,14.5,25.5,34.0,46.5,53.0,59.0,66.0,71.5,82.0,92.5]
          steps=round(97/dt)
          for i in range(steps+1):
              t=i*dt; a=accel(t)
              if i: speed=max(0,speed+(prev+a)*.5*dt)
              prev=a
              for cp in checkpoints:
                  if abs(t-cp) < dt/2:
                      values[cp]=speed*3.6
          expected={6.5:(7,9),14.5:(38,42),25.5:(78,83),34.0:(127,133),46.5:(166,173),71.5:(0,1),82.0:(58,63),92.5:(0,1)}
          for cp,(lo,hi) in expected.items():
              v=values[cp]
              if not lo <= v <= hi:
                  raise SystemExit(f'Demo-Plausibilitaet fehlgeschlagen bei {cp}s: {v:.1f} km/h')
              print(f'{cp:4.1f}s -> {v:6.1f} km/h')
          PY

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-demo-realistic-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/js/app.js .github/workflows/voltune-demo-realistic-once.yml
          git commit -m "Demo-Testfahrt realistischer und weicher gestalten" -m "Die bisher stückweise lineare Demo durch einen kinematischen Fahrzyklus mit weich interpolierten Beschleunigungs-Schlüsselpunkten ersetzt. Geschwindigkeit wird nun aus der Beschleunigung integriert, wodurch Anfahren, Lastaufbau, Lupfen, Konstantfahrt und Rekuperation ohne harte Phasensprünge ineinander übergehen. Die bekannten Prüfpunkte um 8, 40, 80, 130 und 170 km/h bleiben erhalten; Vollast- und Rekuphase testen weiterhin BOV, Schubknallen, DSG-Furz und Rückschaltungen reproduzierbar. JavaScript-Syntax und wichtige Demo-Geschwindigkeiten automatisiert geprüft."
          git push

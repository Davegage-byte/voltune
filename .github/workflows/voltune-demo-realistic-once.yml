name: Voltune Demo Realistic Once

on:
  push:
    paths:
      - '.github/workflows/voltune-demo-realistic-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Demo-Block vorbereiten
        shell: bash
        run: |
          cat > /tmp/demo_block.txt <<'DEMO'
          // =========================
          // Voltune Testfahrt
          // =========================
          //
          // Weiche Beschleunigungskurven mit integrierter Geschwindigkeit.
          // Keine harten Sprünge mehr zwischen Beschleunigen, Konstantfahrt,
          // Lupfen und Reku. Vollast- und Lastwechsel bleiben stark genug,
          // um BOV, Schubknallen, DSG-Furz und Rückschaltungen zu testen.

          const DEMO_DURATION = 97;
          const DEMO_STEP = 0.02;

          const DEMO_ACCEL_KEYFRAMES = [
            [0.0,0.00],[2.5,0.00],[3.3,0.65],[5.7,0.65],[6.5,0.40],
            [7.5,1.30],[13.0,1.30],[14.5,0.00],[18.0,0.00],
            [19.0,1.71],[24.5,1.71],[25.5,0.00],[28.0,0.00],
            [28.7,2.60],[33.3,2.60],[34.0,0.00],[34.4,-0.12],[35.5,0.00],
            [39.0,0.00],[40.0,1.71],[45.5,1.71],[46.5,0.00],
            [46.9,-0.12],[48.0,-0.55],[49.0,-1.55],[52.2,-1.55],
            [53.0,-2.40],[54.0,-3.40],[58.0,-3.40],[59.0,-2.40],
            [60.0,-2.50],[65.0,-2.50],[66.0,-1.20],[67.0,-0.80],
            [70.0,-0.80],[71.5,0.00],[74.0,0.00],
            [74.9,1.60],[75.9,2.50],[81.0,2.50],[82.0,0.00],
            [82.4,-0.12],[83.0,0.00],[83.8,-1.50],[88.5,-2.70],
            [90.5,-1.50],[92.5,-0.70],[94.0,0.00],[97.0,0.00]
          ];

          const DEMO_STATE_PHASES = [
            [2.5,"Demo · Idle"],
            [6.5,"Demo · Anrollen"],
            [14.5,"Demo · Sanft beschleunigen"],
            [18.0,"Demo · Konstant 40"],
            [25.5,"Demo · Mittel beschleunigen"],
            [28.0,"Demo · Konstant 80"],
            [34.0,"Demo · Voll beschleunigen"],
            [35.5,"Demo · Lupfen 130"],
            [39.0,"Demo · Konstant 130"],
            [46.5,"Demo · Beschleunigen Highspeed"],
            [48.0,"Demo · Lupfen 170"],
            [53.0,"Demo · Leichte Reku"],
            [59.0,"Demo · Starke Reku"],
            [66.0,"Demo · Reku"],
            [71.5,"Demo · Ausrollen"],
            [74.0,"Demo · Idle"],
            [82.0,"Demo · Erneut beschleunigen"],
            [83.0,"Demo · Lupfen 60"],
            [94.0,"Demo · Reku bis Stillstand"],
            [97.0,"Demo · Idle"]
          ];

          function demoSmoothstep(value) {
            const p = clamp(value, 0, 1);
            return p * p * (3 - 2 * p);
          }

          function demoAccelerationAt(seconds) {
            for (let i = 0; i < DEMO_ACCEL_KEYFRAMES.length - 1; i++) {
              const [startTime, startAccel] = DEMO_ACCEL_KEYFRAMES[i];
              const [endTime, endAccel] = DEMO_ACCEL_KEYFRAMES[i + 1];

              if (seconds <= endTime) {
                const duration = endTime - startTime;
                const progress = duration > 0
                  ? (seconds - startTime) / duration
                  : 1;
                const blend = demoSmoothstep(progress);

                return startAccel + (endAccel - startAccel) * blend;
              }
            }

            return 0;
          }

          function demoStateAt(seconds) {
            for (const [until, state] of DEMO_STATE_PHASES) {
              if (seconds < until) return state;
            }
            return "Demo · Idle";
          }

          function buildDemoTrajectory() {
            const samples = [];
            let speedMs = 0;
            let previousAccel = demoAccelerationAt(0);
            const sampleCount = Math.ceil(DEMO_DURATION / DEMO_STEP);

            for (let i = 0; i <= sampleCount; i++) {
              const seconds = Math.min(DEMO_DURATION, i * DEMO_STEP);
              const accel = demoAccelerationAt(seconds);

              if (i > 0) {
                speedMs = Math.max(
                  0,
                  speedMs + (previousAccel + accel) * 0.5 * DEMO_STEP
                );
              }

              samples.push({
                kmh: speedMs * 3.6,
                a: speedMs <= 0.002 && accel < 0 ? 0 : accel
              });

              previousAccel = accel;
            }

            return samples;
          }

          const DEMO_TRAJECTORY = buildDemoTrajectory();

          function demoValues(t) {
            const phase = (t / 1000) % DEMO_DURATION;
            const samplePosition = phase / DEMO_STEP;
            const index = Math.min(
              DEMO_TRAJECTORY.length - 1,
              Math.floor(samplePosition)
            );
            const nextIndex = Math.min(
              DEMO_TRAJECTORY.length - 1,
              index + 1
            );
            const blend = samplePosition - index;
            const current = DEMO_TRAJECTORY[index];
            const next = DEMO_TRAJECTORY[nextIndex];

            let kmh = current.kmh + (next.kmh - current.kmh) * blend;
            let a = current.a + (next.a - current.a) * blend;

            if (kmh < 0.05 && a < 0) {
              kmh = 0;
              a = 0;
            }

            return {
              kmh,
              a,
              state: demoStateAt(phase)
            };
          }

          DEMO

      - name: Realistische Demo-Testfahrt integrieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('voltune-dev/js/app.js')
          app = path.read_text(encoding='utf-8')

          start_marker = '''// =========================
          // Voltune Testfahrt
          // ========================='''
          end_marker = '  function updateGamepadDebug() {'

          start = app.find(start_marker)
          if start == -1:
              raise SystemExit('Demo-Startmarker nicht gefunden')

          end = app.find(end_marker, start)
          if end == -1:
              raise SystemExit('Demo-Endmarker nicht gefunden')

          replacement = Path('/tmp/demo_block.txt').read_text(encoding='utf-8')
          app = app[:start] + replacement + app[end:]
          path.write_text(app, encoding='utf-8')
          PY

      - name: JavaScript Syntax prüfen
        run: node --check voltune-dev/js/app.js

      - name: Demo-Kennwerte prüfen
        shell: bash
        run: |
          python3 - <<'PY'
          keyframes = [
            (0.0,0.00),(2.5,0.00),(3.3,0.65),(5.7,0.65),(6.5,0.40),
            (7.5,1.30),(13.0,1.30),(14.5,0.00),(18.0,0.00),
            (19.0,1.71),(24.5,1.71),(25.5,0.00),(28.0,0.00),
            (28.7,2.60),(33.3,2.60),(34.0,0.00),(34.4,-0.12),(35.5,0.00),
            (39.0,0.00),(40.0,1.71),(45.5,1.71),(46.5,0.00),
            (46.9,-0.12),(48.0,-0.55),(49.0,-1.55),(52.2,-1.55),
            (53.0,-2.40),(54.0,-3.40),(58.0,-3.40),(59.0,-2.40),
            (60.0,-2.50),(65.0,-2.50),(66.0,-1.20),(67.0,-0.80),
            (70.0,-0.80),(71.5,0.00),(74.0,0.00),(74.9,1.60),
            (75.9,2.50),(81.0,2.50),(82.0,0.00),(82.4,-0.12),
            (83.0,0.00),(83.8,-1.50),(88.5,-2.70),(90.5,-1.50),
            (92.5,-0.70),(94.0,0.00),(97.0,0.00)
          ]

          def smooth(p):
              p = max(0, min(1, p))
              return p * p * (3 - 2 * p)

          def accel(t):
              for (t0,a0),(t1,a1) in zip(keyframes,keyframes[1:]):
                  if t <= t1:
                      p = (t - t0) / (t1 - t0) if t1 > t0 else 1
                      s = smooth(p)
                      return a0 + (a1 - a0) * s
              return 0

          dt = 0.02
          speed = 0
          prev = accel(0)
          checkpoints = {6.5:(7,9),14.5:(38,42),25.5:(78,83),34.0:(127,133),46.5:(166,173),71.5:(0,1),82.0:(58,63),92.5:(0,1)}
          values = {}

          for i in range(round(97 / dt) + 1):
              t = i * dt
              a = accel(t)
              if i:
                  speed = max(0, speed + (prev + a) * 0.5 * dt)
              prev = a

              for cp in checkpoints:
                  if abs(t - cp) < dt / 2:
                      values[cp] = speed * 3.6

          for cp, (lo, hi) in checkpoints.items():
              v = values[cp]
              if not lo <= v <= hi:
                  raise SystemExit(f'Plausibilitaet fehlgeschlagen bei {cp}s: {v:.1f} km/h')
              print(f'{cp:4.1f}s -> {v:6.1f} km/h')
          PY

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-demo-realistic-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/js/app.js .github/workflows/voltune-demo-realistic-once.yml
          git commit -m "Demo-Testfahrt realistischer und weicher gestalten" -m "Die bisher stückweise lineare Demo durch einen kinematischen Fahrzyklus mit weich interpolierten Beschleunigungs-Schlüsselpunkten ersetzt. Geschwindigkeit wird nun aus der Beschleunigung integriert, wodurch Anfahren, Lastaufbau, Lupfen, Konstantfahrt und Rekuperation ohne harte Phasensprünge ineinander übergehen. Die bekannten Prüfpunkte um 8, 40, 80, 130 und 170 km/h bleiben erhalten; Vollast- und Rekuphase testen weiterhin BOV, Schubknallen, DSG-Furz und Rückschaltungen reproduzierbar. JavaScript-Syntax und wichtige Demo-Geschwindigkeiten automatisiert geprüft."
          git push

name: One-time Uwuntu HDMI v4.5.73

on:
  push:
    paths:
      - '.github/workflows/one-time-uwuntu-hdmi-v4572.yml'

permissions:
  contents: write

jobs:
  fix-hdmi:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HDMI-Fix deterministisch anwenden und prüfen
        shell: bash
        run: |
          set -euo pipefail
          TARGET='uwuntu/Ubuntu Autostart Manager.sh'
          BACKUP_DIR='uwuntu/backups/ubuntu-autostart-manager'
          BACKUP="$BACKUP_DIR/Ubuntu Autostart Manager_backup-$(TZ=Europe/Berlin date +'%Y-%m-%d-%H-%M-%S').sh"
          test -f "$TARGET"
          mkdir -p "$BACKUP_DIR"
          cp -a "$TARGET" "$BACKUP"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('uwuntu/Ubuntu Autostart Manager.sh')
          text = path.read_text(encoding='utf-8')

          if text.count('v4.5.72') != 3:
              raise SystemExit(f'Abbruch: erwartet 3x v4.5.72, gefunden {text.count("v4.5.72")}')
          if text.count('MANAGER_BUILD=2026091501') != 1:
              raise SystemExit('Abbruch: unerwartete MANAGER_BUILD-Version.')

          method_start = text.find('    def refresh_hdmi_status(self):\n')
          method_end = text.find('\n    def poll_hdmi_status(self):', method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit('Abbruch: HDMI-Statusmethode nicht gefunden.')

          replacement = (
              '    def refresh_hdmi_status(self):\n'
              '        state, detail = detect_hdmi()\n'
              '        if state == "connected":\n'
              '            self.hdmi_ever_connected = True\n'
              '            self.set_hdmi_status_ui("blue", detail, "HDMI")\n'
              '        elif state == "checking":\n'
              '            self.set_hdmi_status_ui("blue", "PRÜFE VERBINDUNG", "HDMI")\n'
              '        elif state == "error":\n'
              '            self.set_hdmi_status_ui("red", "FEHLERHAFT", "HDMI")\n'
              '        elif self.hdmi_ever_connected:\n'
              '            self.set_hdmi_status_ui("green", "GETESTET", "HDMI")\n'
              '        else:\n'
              '            self.set_hdmi_status_ui("orange", "NICHT GETESTET", "HDMI")\n'
              '        return False\n'
          )
          text = text[:method_start] + replacement + text[method_end:]

          old_edid = (
              '    available_blocks = len(data) // 128\n'
              '    declared_blocks = 1 + int(data[126])\n'
              '    blocks_to_check = min(available_blocks, declared_blocks)\n'
              '    if blocks_to_check < 1:\n'
              '        return False\n'
          )
          new_edid = (
              '    available_blocks = len(data) // 128\n'
              '    declared_blocks = 1 + int(data[126])\n'
              '    if available_blocks < declared_blocks:\n'
              '        return False\n'
              '    blocks_to_check = declared_blocks\n'
          )
          if text.count(old_edid) != 1:
              raise SystemExit('Abbruch: erwarteter EDID-Block nicht eindeutig gefunden.')
          text = text.replace(old_edid, new_edid, 1)

          text = text.replace('v4.5.72', 'v4.5.73')
          text = text.replace('MANAGER_BUILD=2026091501', 'MANAGER_BUILD=2026091502', 1)

          exact_method_prefix = (
              '    def refresh_hdmi_status(self):\n'
              '        state, detail = detect_hdmi()\n'
              '        if state == "connected":\n'
          )
          if exact_method_prefix not in text:
              raise SystemExit('Abbruch: finale HDMI-Methode ist nicht korrekt eingerückt.')

          required = [
              'from gi.repository import Gtk, Gdk, GLib, Pango, Gio',
              'return f"{int(width)}x{int(height)} · {hz}Hz"',
              'if available_blocks < declared_blocks:',
              'problems.append("HDMI verbunden, aber EDID ungültig")',
              'problems.append("HDMI verbunden, aber kein aktiver Anzeigemodus")',
              'self.set_hdmi_status_ui("blue", detail, "HDMI")',
              'self.set_hdmi_status_ui("red", "FEHLERHAFT", "HDMI")',
              'self.set_hdmi_status_ui("green", "GETESTET", "HDMI")',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Abbruch: erwartete HDMI-Zeile fehlt: {needle}')

          # Exakt das Hardware-Check-Heredoc kompilieren, verankert am eindeutigen
          # /tmp/hardware-check-Dateinamen statt an einem Klassennamen.
          anchor = 'TMP_PY="$(mktemp /tmp/hardware-check.XXXXXX.py)"\n'
          anchor_pos = text.find(anchor)
          if anchor_pos < 0:
              raise SystemExit('Abbruch: Hardware-Check-TMP_PY-Anker nicht gefunden.')
          marker = 'cat > "$TMP_PY" <<\'PY\'\n'
          heredoc_start = text.find(marker, anchor_pos)
          if heredoc_start < 0:
              raise SystemExit('Abbruch: Hardware-Check-Python-Heredoc nicht gefunden.')
          heredoc_start += len(marker)
          heredoc_end = text.find('\nPY\n', heredoc_start)
          if heredoc_end < 0:
              raise SystemExit('Abbruch: Ende des Hardware-Check-Python-Heredocs nicht gefunden.')
          compile(text[heredoc_start:heredoc_end], '<hardware-check>', 'exec')

          path.write_text(text, encoding='utf-8')
          PY

          bash -n "$TARGET"
          git diff --check

          git config user.name 'ChatGPT Uwuntu Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$TARGET" "$BACKUP"
          git commit \
            -m 'HDMI-Statusblock korrigieren' \
            -m 'Ich habe die Einrückung des HDMI-Statusblocks korrigiert und die EDID-Prüfung verschärft. Bei gültiger HDMI-Verbindung werden Auflösung und Bildwiederholrate blau angezeigt, bei ungültiger EDID oder fehlendem aktivem Modus wird FEHLERHAFT rot angezeigt und nach einem erfolgreichen Test bleibt das Ausstecken grün als GETESTET.'
          git push origin HEAD:main

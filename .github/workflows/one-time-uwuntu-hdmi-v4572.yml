name: One-time Uwuntu HDMI v4.5.73

on:
  push:
    paths:
      - '.github/workflows/one-time-uwuntu-hdmi-v4572.yml'

permissions:
  contents: write

jobs:
  fix-hdmi:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HDMI-Statusblock korrigieren und streng prüfen
        shell: bash
        run: |
          set -euo pipefail
          TARGET='uwuntu/Ubuntu Autostart Manager.sh'
          BACKUP_DIR='uwuntu/backups/ubuntu-autostart-manager'
          BACKUP="$BACKUP_DIR/Ubuntu Autostart Manager_backup-$(TZ=Europe/Berlin date +'%Y-%m-%d-%H-%M-%S').sh"
          test -f "$TARGET"
          mkdir -p "$BACKUP_DIR"
          cp -a "$TARGET" "$BACKUP"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('uwuntu/Ubuntu Autostart Manager.sh')
          text = path.read_text(encoding='utf-8')

          if text.count('v4.5.72') != 3:
              raise SystemExit(f'Abbruch: erwartet wurden 3 Vorkommen von v4.5.72, gefunden: {text.count("v4.5.72")}')
          text = text.replace('v4.5.72', 'v4.5.73')

          if text.count('MANAGER_BUILD=2026091501') != 1:
              raise SystemExit('Abbruch: unerwartete MANAGER_BUILD-Version.')
          text = text.replace('MANAGER_BUILD=2026091501', 'MANAGER_BUILD=2026091502', 1)

          bad = '''    def refresh_hdmi_status(self):
              state, detail = detect_hdmi()
              if state == "connected":
                  self.hdmi_ever_connected = True
                  self.set_hdmi_status_ui("blue", detail, "HDMI")
              elif state == "checking":
                  self.set_hdmi_status_ui("blue", "PRÜFE VERBINDUNG", "HDMI")
              elif state == "error":
                  self.set_hdmi_status_ui("red", "FEHLERHAFT", "HDMI")
              elif self.hdmi_ever_connected:
                  self.set_hdmi_status_ui("green", "GETESTET", "HDMI")
              else:
                  self.set_hdmi_status_ui("orange", "NICHT GETESTET", "HDMI")
              return False
          '''
          # Der gepushte v4.5.72-Block besitzt nur 4 statt 8 Leerzeichen im Body.
          bad = bad.replace('\n              ', '\n    ')

          good = '''    def refresh_hdmi_status(self):
                  state, detail = detect_hdmi()
                  if state == "connected":
                      self.hdmi_ever_connected = True
                      self.set_hdmi_status_ui("blue", detail, "HDMI")
                  elif state == "checking":
                      self.set_hdmi_status_ui("blue", "PRÜFE VERBINDUNG", "HDMI")
                  elif state == "error":
                      self.set_hdmi_status_ui("red", "FEHLERHAFT", "HDMI")
                  elif self.hdmi_ever_connected:
                      self.set_hdmi_status_ui("green", "GETESTET", "HDMI")
                  else:
                      self.set_hdmi_status_ui("orange", "NICHT GETESTET", "HDMI")
                  return False
          '''
          # YAML/Shell-Einrückung aus den Triple-Strings entfernen: def=4, Body=8.
          good = '\n'.join(line[4:] if line.startswith('    ') else line for line in good.split('\n'))

          if text.count(bad) != 1:
              # Direkter Fallback auf den exakt im Repo vorhandenen Block.
              start = text.find('    def refresh_hdmi_status(self):\n')
              end = text.find('\n    def poll_hdmi_status(self):', start)
              if start < 0 or end < 0:
                  raise SystemExit('Abbruch: refresh_hdmi_status-Block nicht eindeutig gefunden.')
              current = text[start:end]
              lines = current.splitlines()
              if not lines or lines[0] != '    def refresh_hdmi_status(self):':
                  raise SystemExit('Abbruch: unerwarteter HDMI-Statusblock.')
              fixed_lines = [lines[0]]
              for line in lines[1:]:
                  if line.startswith('    ') and not line.startswith('        '):
                      fixed_lines.append('    ' + line)
                  else:
                      fixed_lines.append(line)
              replacement = '\n'.join(fixed_lines)
              text = text[:start] + replacement + text[end:]
          else:
              text = text.replace(bad, good, 1)

          # EDID streng: angekündigte Erweiterungsblöcke müssen vollständig vorliegen.
          old_edid = '''    available_blocks = len(data) // 128
              declared_blocks = 1 + int(data[126])
              blocks_to_check = min(available_blocks, declared_blocks)
              if blocks_to_check < 1:
                  return False
          '''
          old_edid = '\n'.join(line[4:] if line.startswith('    ') else line for line in old_edid.split('\n'))
          new_edid = '''    available_blocks = len(data) // 128
              declared_blocks = 1 + int(data[126])
              if available_blocks < declared_blocks:
                  return False
              blocks_to_check = declared_blocks
          '''
          new_edid = '\n'.join(line[4:] if line.startswith('    ') else line for line in new_edid.split('\n'))
          if text.count(old_edid) == 1:
              text = text.replace(old_edid, new_edid, 1)

          required = [
              'from gi.repository import Gtk, Gdk, GLib, Pango, Gio',
              'return f"{int(width)}x{int(height)} · {hz}Hz"',
              'problems.append("HDMI verbunden, aber EDID ungültig")',
              'problems.append("HDMI verbunden, aber kein aktiver Anzeigemodus")',
              'self.set_hdmi_status_ui("blue", detail, "HDMI")',
              'self.set_hdmi_status_ui("red", "FEHLERHAFT", "HDMI")',
              'self.set_hdmi_status_ui("green", "GETESTET", "HDMI")',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Abbruch: erwartete HDMI-Zeile fehlt: {needle}')

          marker = 'cat > "$TMP_PY" <<\'PY\'\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Abbruch: Hardware-Check-Heredoc nicht gefunden.')
          start += len(marker)
          end = text.find('\nPY\n', start)
          if end < 0:
              raise SystemExit('Abbruch: Ende des Hardware-Check-Heredocs nicht gefunden.')
          source = text[start:end]
          compile(source, '<hardware-check>', 'exec')

          # Explizite Einrückungsprüfung für den finalen Methodenblock.
          method = '    def refresh_hdmi_status(self):\n        state, detail = detect_hdmi()\n'
          if method not in text:
              raise SystemExit('Abbruch: refresh_hdmi_status ist final nicht korrekt eingerückt.')

          path.write_text(text, encoding='utf-8')
          PY

          bash -n "$TARGET"
          git diff --check

          git config user.name 'ChatGPT Uwuntu Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$TARGET" "$BACKUP"
          git commit \
            -m 'HDMI-Statusblock korrigieren' \
            -m 'Ich habe die Einrückung des neuen HDMI-Statusblocks korrigiert und die EDID-Prüfung verschärft. Die blaue Anzeige mit Auflösung und Bildwiederholrate, die rote Fehlererkennung bei ungültiger EDID oder fehlendem aktivem Modus sowie das grüne GETESTET nach erfolgreichem Abziehen bleiben erhalten.'
          git push origin HEAD:main

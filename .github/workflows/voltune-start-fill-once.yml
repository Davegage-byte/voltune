name: Voltune Start Fill Once

on:
  push:
    paths:
      - '.github/workflows/voltune-start-fill-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch CSS
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-start-fill-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/css/voltune.css .github/workflows/voltune-start-fill-once.yml
          git commit -m "Start-Button füllt Ganganzeige vollständig aus" -m "Den zusätzlichen dunklen Innenrahmen um den großen Start-Button entfernt. Im Startzustand hat die Ganganzeige keinen Innenabstand mehr, übernimmt die grüne Startfarbe und schneidet den Button sauber an ihren Rundungen ab. Der Button füllt damit die komplette Fläche des Gang-Kästchens aus und bleibt responsiv auf Handy, Tesla-Browser und Desktop."
          git push

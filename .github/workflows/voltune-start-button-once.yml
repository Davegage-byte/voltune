name: Voltune Start Button Once

on:
  push:
    paths:
      - '.github/workflows/voltune-start-button-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch CSS
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/voltune-start-button-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/css/voltune.css .github/workflows/voltune-start-button-once.yml
          git commit -m "Start-Button groß über der Ganganzeige platzieren" -m "Der zentrale Start-Button liegt vor dem ersten Start groß über der Ganganzeige. Sobald GPS und Audio erfolgreich aktiviert wurden, verwendet die bereits vorhandene active-Klasse wieder die normale Position in der Steuerungsgruppe direkt über STOP. Nach STOP wird der große Startzustand erneut sichtbar. JavaScript und Fahrlogik bleiben unverändert; die Änderung erfolgt ausschließlich per CSS."
          git push

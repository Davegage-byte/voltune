name: Voltune Sidebar Compact Once

'on':
  push:
    paths:
      - '.github/workflows/voltune-sidebar-compact-once.yml'
      - '.github/scripts/voltune-sidebar-compact-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kompakte Seitenleiste anwenden
        run: python3 .github/scripts/voltune-sidebar-compact-patch.py

      - name: Patch prüfen
        shell: bash
        run: |
          grep -q 'UI-FIX · Kompakte niedrige Seitenleiste' voltune-dev/css/voltune.css
          git diff --check

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-sidebar-compact-once.yml
          rm .github/scripts/voltune-sidebar-compact-patch.py
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/css/voltune.css .github/workflows/voltune-sidebar-compact-once.yml .github/scripts/voltune-sidebar-compact-patch.py
          git commit -m "Seitenleiste bei geringer Höhe kompakt ausrichten" -m "Den bestehenden Kompaktmodus für niedrige Desktop- und Tesla-Ansichten korrigiert. Optionen und System spannen nun wieder die volle Seitenleistenbreite auf und verwenden intern platzsparende 2x2- bzw. Zweispalten-Raster. Die Fahrmodi liegen in einer kompakten Dreierzeile; HUD, Betriebsstatus, Abstände und Buttonhöhen werden bei geringer Viewport-Höhe moderat reduziert. Dadurch verschwinden die seitlichen Verschiebungen und die normale Bedienung benötigt deutlich weniger vertikalen Platz. Debug darf weiterhin zusätzlichen Platz beanspruchen. Fahr-, Sound- und Triggerlogik bleiben unverändert."
          git push

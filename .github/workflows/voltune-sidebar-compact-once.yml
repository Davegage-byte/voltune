name: Voltune Sidebar Compact Once

'on':
  push:
    paths:
      - '.github/workflows/voltune-sidebar-compact-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kompakte Seitenleiste ergänzen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('voltune-dev/css/voltune.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* UI-FIX · Kompakte niedrige Seitenleiste */'

          if marker in css:
              raise SystemExit('Patch bereits vorhanden')

          css += r'''

/* UI-FIX · Kompakte niedrige Seitenleiste */
@media (min-width:761px) and (max-height:650px){
  .sideRail{
    gap:5px;
    overflow-x:hidden;
  }

  .driveHud{
    padding:6px;
  }

  .driveHudInfo{
    gap:3px;
  }

  .driveHudInfo > div{
    padding:4px 5px;
  }

  .driveHudGear.startButtonPending > .gpsStartSlot,
  .gpsStartSlot #gps.mainStartButton{
    min-height:72px;
  }

  .gpsStartSlot #gps.mainStartButton{
    font-size:22px;
  }

  .driveHudRpm{
    padding:5px !important;
  }

  #rpmDisplay{
    font-size:22px;
  }

  .bar{
    height:6px;
    margin-top:5px;
  }

  .runStatus{
    min-height:24px;
    margin-top:5px;
    padding:4px 7px;
    font-size:9px;
  }

  .runStatusDot{
    width:6px;
    height:6px;
    flex-basis:6px;
  }

  .driveModeGroup{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:4px;
    padding:6px;
  }

  .driveModeTitle{
    grid-column:1 / -1;
    padding-bottom:0;
  }

  .sideRail .driveModeBtn{
    min-width:0;
    min-height:28px;
    padding:0 2px;
    font-size:10px;
    white-space:nowrap;
  }

  .controlGroup{
    gap:3px;
    padding:6px;
  }

  .controlGroupTitle{
    padding-bottom:0;
  }

  .sideButtons{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:4px;
  }

  .sideButtons > #gps.mainStartButton{
    grid-column:1 / -1;
  }

  .sideRail button{
    min-width:0;
    min-height:30px;
    border-radius:8px;
    font-size:11px;
  }

  .controlSubgroup{
    grid-column:1 / -1;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:4px;
    margin-top:2px;
    padding-top:5px;
    min-width:0;
  }

  .controlSubgroupTitle{
    grid-column:1 / -1;
    padding:0 2px;
    font-size:7px;
  }

  .controlSubgroup .featureBtn,
  .controlSubgroup #debug,
  .controlSubgroup #start,
  .controlSubgroup #controller{
    min-width:0;
    min-height:30px;
    padding:0 3px;
    font-size:10px;
  }

  .controlSubgroupSystem{
    margin-top:0;
  }

  #theme{
    white-space:nowrap;
  }
}
'''

          path.write_text(css, encoding='utf-8')
          PY

      - name: Patch prüfen
        shell: bash
        run: |
          grep -q 'UI-FIX · Kompakte niedrige Seitenleiste' voltune-dev/css/voltune.css
          git diff --check

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-sidebar-compact-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/css/voltune.css .github/workflows/voltune-sidebar-compact-once.yml
          git commit -m "Seitenleiste bei geringer Höhe kompakt ausrichten" -m "Den bestehenden Kompaktmodus für niedrige Desktop- und Tesla-Ansichten korrigiert. Optionen und System spannen nun wieder die volle Seitenleistenbreite auf und verwenden intern platzsparende 2x2- bzw. Zweispalten-Raster. Die Fahrmodi liegen in einer kompakten Dreierzeile; HUD, Betriebsstatus, Abstände und Buttonhöhen werden bei geringer Viewport-Höhe moderat reduziert. Dadurch verschwinden die seitlichen Verschiebungen und die normale Bedienung benötigt deutlich weniger vertikalen Platz. Debug darf weiterhin zusätzlichen Platz beanspruchen. Fahr-, Sound- und Triggerlogik bleiben unverändert."
          git push

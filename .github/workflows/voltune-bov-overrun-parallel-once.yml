name: Voltune BOV Overrun Parallel Once

on:
  push:
    paths:
      - '.github/workflows/voltune-bov-overrun-parallel-once.yml'

permissions:
  contents: write

jobs:
  patch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: BOV und Schubknallen parallel freigeben
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('voltune-dev/js/audio.js')
          text = path.read_text(encoding='utf-8')

          marker = "  triggerTurboFlutter("
          positions = []
          start = 0
          while True:
              pos = text.find(marker, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + len(marker)

          if len(positions) != 1:
              raise SystemExit(f'triggerTurboFlutter-Aufruf: erwartet 1 Treffer, gefunden {len(positions)}')

          call_start = positions[0]
          call_end = text.find("\n  );", call_start)
          if call_end < 0:
              raise SystemExit('Ende des triggerTurboFlutter-Aufrufs nicht gefunden')

          insert_at = call_end + len("\n  );")

          insertion = (
              "\n\n"
              "  // BOV und Schubknallen dürfen wieder gleichzeitig\n"
              "  // aus derselben Lastphase starten. Sobald das BOV\n"
              "  // entlädt und das Schubknallen bereits vorbereitet ist,\n"
              "  // startet der Overrun ohne den sonstigen 25-ms-Puffer.\n"
              "  // Eine bereits laufende DSG-Sequenz behält über\n"
              "  // shiftBurbleUntil weiterhin ihre Priorität.\n"
              "  if (\n"
              "    overrunArmed &&\n"
              "    Number(settings.overrunVolume) > 0 &&\n"
              "    nowMs - lastOverrunAt > overrunCooldown\n"
              "  ) {\n"
              "    const simultaneousOverrunIntensity =\n"
              "      clamp(\n"
              "        (overrunPeakAccel - 0.8) / 1.7,\n"
              "        0.15,\n"
              "        1\n"
              "      );\n\n"
              "    triggerOverrun(\n"
              "      simultaneousOverrunIntensity,\n"
              "      settings.overrunVolume,\n"
              "      true,\n"
              "      drivingStyle\n"
              "    );\n\n"
              "    overrunTriggered = true;\n"
              "    lastOverrunAt = nowMs;\n"
              "    overrunPeakAccel = 0;\n"
              "    overrunArmed = false;\n"
              "  }"
          )

          if "simultaneousOverrunIntensity" in text:
              raise SystemExit('Parallel-Logik ist bereits vorhanden')

          text = text[:insert_at] + insertion + text[insert_at:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: JavaScript Syntax prüfen
        run: node --check voltune-dev/js/audio.js

      - name: Änderung committen und One-Shot-Workflow entfernen
        shell: bash
        run: |
          rm .github/workflows/voltune-bov-overrun-parallel-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/js/audio.js .github/workflows/voltune-bov-overrun-parallel-once.yml
          git commit -m "BOV und Schubknallen wieder parallel auslösen" -m "BOV und Schubknallen dürfen bei derselben Lastwegnahme wieder gleichzeitig starten. Sobald das BOV auslöst und das Schubknallen aus derselben Lastphase bereits vorbereitet ist, wird der Overrun direkt ohne den sonstigen 25-ms-Puffer gestartet. Eine bereits laufende DSG-Sequenz behält über shiftBurbleUntil weiterhin Priorität. Klang, Lautstärken, Trigger-Schwellen und die übrige Soundlogik bleiben unverändert. JavaScript-Syntax mit node --check geprüft."
          git push

name: Voltune BOV Overrun Parallel Once

on:
  push:
    paths:
      - '.github/workflows/voltune-bov-overrun-parallel-once.yml'

permissions:
  contents: write

jobs:
  patch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: BOV und Schubknallen koordinieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/voltune_patch.py
          python3 /tmp/voltune_patch.py

      - name: JavaScript Syntax prüfen
        run: node --check voltune-dev/js/audio.js

      - name: Änderung committen und One-Shot-Workflow entfernen
        shell: bash
        run: |
          rm .github/workflows/voltune-bov-overrun-parallel-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/js/audio.js .github/workflows/voltune-bov-overrun-parallel-once.yml
          git commit -m "BOV und Schubknallen wieder parallel auslösen" -m "BOV und Schubknallen werden bei einer gemeinsamen Lastwegnahme wieder zeitgleich freigegeben, sobald beide Effekte aus derselben Lastphase bereitstehen und ihre jeweiligen Auslösebedingungen erfüllt sind. Die unterschiedlichen Release-Schwellen führen dadurch nicht mehr zu einem künstlichen Nacheinander. Bei gemeinsamem Release umgeht das Schubknallen den 25-ms-Puffer und startet direkt mit dem BOV; die bestehende DSG-Priorität über shiftBurbleUntil bleibt erhalten. Ist nur einer der beiden Effekte aktiv, hörbar oder auslösebereit, arbeitet er weiterhin unabhängig. Klang, Lautstärken und Empfindlichkeitsschwellen bleiben unverändert. JavaScript-Syntax mit node --check geprüft."
          git push

name: Voltune Debug Cleanup V2 Once

on:
  push:
    paths:
      - '.github/workflows/voltune-debug-cleanup-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vorhandene Debug-Karten gruppieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('voltune-dev/index.html')
          css_path = Path('voltune-dev/css/voltune.css')

          text = index_path.read_text(encoding='utf-8')
          lines = text.splitlines()

          def div_block(marker, class_marker):
              marker_index = next(i for i, line in enumerate(lines) if marker in line)
              start = next(
                  i for i in range(marker_index, -1, -1)
                  if class_marker in lines[i]
              )
              depth = 0
              for i in range(start, len(lines)):
                  depth += lines[i].count('<div')
                  depth -= lines[i].count('</div>')
                  if depth == 0:
                      return start, i
              raise RuntimeError(f'Block nicht geschlossen: {marker}')

          state_s, state_e = div_block('id="state"', 'class="stateBox debugOnly"')
          trigger_s, trigger_e = div_block('id="debugTriggerProfile"', 'class="gpsPanel debugOnly"')
          gps1_s, gps1_e = div_block('id="gpsStatus"', 'class="gpsPanel debugOnly"')
          gps2_s, gps2_e = div_block('id="gpsRawSpeed"', 'class="gpsPanel debugOnly"')
          controller_s, controller_e = div_block('id="gamepadStatus"', 'class="gpsPanel debugOnly"')
          viewport_s, viewport_e = div_block('id="viewportSize"', 'class="gpsPanel debugOnly"')

          if not (
              state_s < trigger_s < gps1_s < gps2_s < controller_s < viewport_s
          ):
              raise RuntimeError('Debug-Blöcke nicht in erwarteter Reihenfolge')

          def block(start, end):
              return '\n'.join(lines[start:end + 1])

          state = block(state_s, state_e).replace(
              'class="stateBox debugOnly"',
              'class="stateBox"',
              1
          )

          trigger = block(trigger_s, trigger_e).replace(
              'class="gpsPanel debugOnly"',
              'class="gpsPanel triggerDebugPanel"',
              1
          ).replace(
              '>Trigger-Debug<',
              '>Profil<',
              1
          )

          gps1 = block(gps1_s, gps1_e).replace(
              'class="gpsPanel debugOnly"',
              'class="gpsPanel"',
              1
          )

          gps2 = block(gps2_s, gps2_e).replace(
              'class="gpsPanel debugOnly"',
              'class="gpsPanel"',
              1
          )

          controller = block(controller_s, controller_e).replace(
              'class="gpsPanel debugOnly"',
              'class="gpsPanel"',
              1
          )

          viewport = block(viewport_s, viewport_e).replace(
              'class="gpsPanel debugOnly"',
              'class="gpsPanel"',
              1
          )

          rebuilt = f'''<div class="debugCore debugOnly">
          {state}

          {trigger}
          </div>

          <details class="debugFold debugOnly">
            <summary><span>GPS</span><small>Status · Rohdaten · Glättung</small></summary>
            <div class="debugFoldBody">
          {gps1}

          {gps2}
            </div>
          </details>

          <details class="debugFold debugOnly">
            <summary><span>Controller</span><small>Gamepad · Pedale · Achsen</small></summary>
            <div class="debugFoldBody">
          {controller}
            </div>
          </details>

          <details class="debugFold debugOnly">
            <summary><span>Browser / Viewport</span><small>Größe · Skalierung · Pixel Ratio</small></summary>
            <div class="debugFoldBody">
          {viewport}
            </div>
          </details>'''

          lines[state_s:viewport_e + 1] = rebuilt.splitlines()
          new_text = '\n'.join(lines) + '\n'

          required_ids = [
              'state', 'debugTriggerProfile', 'gpsStatus', 'gpsRawSpeed',
              'gamepadStatus', 'viewportSize', 'devicePixelRatio'
          ]

          for element_id in required_ids:
              count = new_text.count(f'id="{element_id}"')
              if count != 1:
                  raise RuntimeError(f'{element_id}: {count} Treffer')

          if new_text.count('class="debugFold debugOnly"') != 3:
              raise RuntimeError('Nicht genau drei einklappbare Debug-Gruppen')

          index_path.write_text(new_text, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* DEBUG COMPACT GROUPS V2 */'

          if marker in css:
              raise RuntimeError('Debug-CSS bereits vorhanden')

          css += r'''

          /* DEBUG COMPACT GROUPS V2 */

          body.debugActive .debugCore.debugOnly{
            display:grid !important;
          }

          body.debugActive .debugFold.debugOnly{
            display:block !important;
          }

          .debugCore{
            grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);
            gap:10px;
            margin:0 0 10px;
          }

          .debugCore .stateBox{
            margin:0;
            padding:12px;
            border-radius:14px;
          }

          .debugCore .state{
            margin-top:5px;
            font-size:24px;
          }

          .debugCore .accel{
            margin-top:6px;
            font-size:16px;
          }

          .debugCore .meter{
            gap:6px;
            margin-top:10px;
          }

          .debugCore .meter div,
          .triggerDebugPanel .gpsItem{
            padding:8px 9px;
            border-radius:9px;
          }

          .debugCore .meter b,
          .triggerDebugPanel .gpsItem b{
            font-size:14px;
          }

          .triggerDebugPanel{
            grid-template-columns:repeat(3,minmax(0,1fr));
            gap:6px;
            margin:0;
          }

          .debugFold{
            margin:0 0 7px;
            overflow:hidden;
            background:var(--panel2);
            border:1px solid var(--line);
            border-radius:12px;
          }

          .debugFold summary{
            display:flex;
            align-items:center;
            gap:10px;
            min-height:42px;
            padding:9px 11px;
            cursor:pointer;
            list-style:none;
            user-select:none;
            font-size:13px;
            font-weight:800;
          }

          .debugFold summary::-webkit-details-marker{
            display:none;
          }

          .debugFold summary small{
            margin-left:auto;
            color:var(--muted);
            font-size:10px;
            font-weight:600;
          }

          .debugFold summary::after{
            content:"›";
            color:var(--muted);
            font-size:22px;
            line-height:1;
            transform:rotate(0deg);
            transition:transform .15s ease;
          }

          .debugFold[open] summary::after{
            transform:rotate(90deg);
          }

          .debugFoldBody{
            display:grid;
            gap:7px;
            padding:8px;
            border-top:1px solid var(--line);
          }

          .debugFold .gpsPanel{
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:6px;
            margin:0;
          }

          .debugFold .gpsItem{
            padding:8px 9px;
            border-radius:9px;
          }

          .debugFold .gpsItem b{
            font-size:13px;
          }

          @media(max-width:1050px){
            .debugCore{
              grid-template-columns:1fr;
            }
          }

          @media(max-width:760px){
            .triggerDebugPanel,
            .debugFold .gpsPanel{
              grid-template-columns:1fr 1fr;
            }

            .debugFold summary small{
              display:none;
            }
          }
          '''

          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Struktur prüfen
        shell: bash
        run: |
          grep -q 'class="debugCore debugOnly"' voltune-dev/index.html
          test "$(grep -c 'class="debugFold debugOnly"' voltune-dev/index.html)" -eq 3
          grep -q 'DEBUG COMPACT GROUPS V2' voltune-dev/css/voltune.css

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm -f .github/workflows/voltune-debug-cleanup-once.yml
          rm -f .github/workflows/voltune-debug-cleanup-v2-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/index.html voltune-dev/css/voltune.css .github/workflows/voltune-debug-cleanup-once.yml .github/workflows/voltune-debug-cleanup-v2-once.yml
          git commit -m "Debug-Bereich kompakter und einklappbar strukturieren" -m "Den stark gewachsenen Debug-Bereich übersichtlicher gegliedert, ohne Diagnosewerte zu entfernen. Fahrzustand/Sound und Trigger-Debug bleiben direkt sichtbar und liegen auf breiten Displays kompakt nebeneinander. GPS-, Controller- und Browser-/Viewport-Diagnose sind nun als einklappbare Bereiche organisiert und standardmäßig geschlossen. Auf kleinen Displays bleiben die Diagnosekarten zweispaltig und werden responsiv untereinander angeordnet. Fahr-, Sound- und Triggerlogik bleiben unverändert."
          git push

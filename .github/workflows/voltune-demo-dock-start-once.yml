name: Voltune Demo Dock Start Once

on:
  push:
    paths:
      - '.github/workflows/voltune-demo-dock-start-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Demo-Start-Button aus Ganganzeige verschieben
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('voltune-dev/js/app.js')
          text = path.read_text(encoding='utf-8')

          old = '''  ui.start.addEventListener("click", async () => {
    if (!await ensureVoltuneAudio()) return;
    
    VoltuneAudio.resetDrivingState();'''

          new = '''  ui.start.addEventListener("click", async () => {
    if (!await ensureVoltuneAudio()) return;

    // Auch die Demo ist ein echter Startzustand:
    // Den großen START aus der Ganganzeige entfernen
    // und an seine normale Position zurücksetzen.
    dockGpsStartButton();
    
    VoltuneAudio.resetDrivingState();'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Demo-Start-Marker: erwartet 1 Treffer, gefunden {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: JavaScript Syntax prüfen
        run: node --check voltune-dev/js/app.js

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-demo-dock-start-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/js/app.js .github/workflows/voltune-demo-dock-start-once.yml
          git commit -m "Start-Button auch bei Demo aus Ganganzeige entfernen" -m "Beim erfolgreichen Start der Demo wird der große START-Button nun wie beim GPS-Start aus dem Gang-Kästchen entfernt und an seine normale Position in der Steuerung zurückverschoben. Dadurch wird die Ganganzeige während der Demo sofort sichtbar. Demo-Fahrzyklus, Soundlogik und GPS-Verhalten bleiben unverändert. JavaScript-Syntax mit node --check geprüft."
          git push

name: Voltune Debug Cleanup Once

on:
  push:
    paths:
      - '.github/workflows/voltune-debug-cleanup-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug-Bereich kompakter strukturieren
        shell: bash
        run: |
          echo '  cjsKICB9Cgp9JycKbWVkaWFfcmVwbGFjZW1lbnQgPSAnJydAbWVkaWEobWF4LXdpZHRoOjEwNTBweCl7CgogIC5jb250cm9sc3sKICAgIGdyaWQtdGVtcGxhdGUtY29sdW1uczoKICAgICAgMWZyIDFm cjsKICB9CgogIC5kZWJ1Z0NvcmV7CiAgICBncmlkLXRlbXBsYXRlLWNvbHVtbnM6CiAgICAgIDFm cjsKICB9Cgp9JycKaWYgbWVkaWFfYW5jaG9yIG5vdCBpbiBjc3M6CiAgICByYWlzZSBTeXN0ZW1FeGl0KCIxMDUwIG1lZGlhIGFuY2hvciBtaXNzaW5nIikKY3NzID0gY3NzLnJlcGxhY2UobWVkaWFfYW5jaG9yLCBtZWRpYV9yZXBsYWNlbWVudCwgMSkKCm1vYmlsZV9hbmNob3IgPSAnJycgIC5ncHNQYW5lbHsKICAgIGdyaWQtdGVtcGxhdGUtY29sdW1uczoKICAgICAgMWZyIDFm cjsKICB9CgogIC5tZXRlcnsnJwptb2JpbGVfcmVwbGFjZW1lbnQgPSAnJycgIC5ncHNQYW5lbHsKICAgIGdyaWQtdGVtcGxhdGUtY29sdW1uczoKICAgICAgMWZyIDFm cjsKICB9CgogIC50cmlnZ2VyRGVidWdQYW5lbCwKICAuZGVidWdGb2xkIC5ncHNQYW5lbHsKICAgIGdyaWQtdGVtcGxhdGUtY29sdW1uczoKICAgICAgMWZyIDFm ' | base64 -d > /tmp/voltune-debug-cleanup.py
          python3 /tmp/voltune-debug-cleanup.py

      - name: Struktur prüfen
        shell: bash
        run: |
          grep -q 'class="debugCore debugOnly"' voltune-dev/index.html
          test "$(grep -c 'class="debugFold debugOnly"' voltune-dev/index.html)" -eq 3
          grep -q 'debugFoldTitle' voltune-dev/css/voltune.css

      - name: Commit und Cleanup
        shell: bash
        run: |
          rm .github/workflows/voltune-debug-cleanup-once.yml
          git config user.name "Davegage-byte"
          git config user.email "74912940+Davegage-byte@users.noreply.github.com"
          git add voltune-dev/index.html voltune-dev/css/voltune.css .github/workflows/voltune-debug-cleanup-once.yml
          git commit -m "Debug-Bereich kompakter und einklappbar strukturieren" -m "Den stark gewachsenen Debug-Bereich übersichtlicher gegliedert, ohne Diagnosewerte zu entfernen. Fahrzustand/Sound und Trigger-Debug bleiben direkt sichtbar und liegen auf breiten Displays kompakt nebeneinander. GPS-, Controller- und Browser-/Viewport-Diagnose sind nun als einklappbare Bereiche organisiert und standardmäßig geschlossen. Auf kleinen Displays bleiben alle Debug-Karten zweispaltig und die Bereiche werden responsiv untereinander angeordnet. Fahr-, Sound- und Triggerlogik bleiben unverändert."
          git push

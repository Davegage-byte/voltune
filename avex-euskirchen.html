<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AVEX Preis</title>

<style>

.green {
    color: #00d26a;
}

.yellow {
    color: #ffd000;
}

.red {
    color: #ff4d4d;
}


body{
    margin:0;
    background:#111;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.box{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.price{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
}

.time{
    color:#999;
    margin-bottom:30px;
}

button{
    font-size:18px;
    padding:12px 24px;
    cursor:pointer;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

</style>

</head>
<body>

<div class="box">

    <h1>
      <a href="https://www.google.com/maps?q=50.6896199,6.784954X Euskirchen
      </a>
    </h1>

    <div id="price" class="price">
        Lädt...
    </div>

    <div id="updated" class="time">
        Bitte warten...
    </div>

    <div id="refreshInfo" class="time">
        Letzte Änderung: --:-- | Refresh in 05:00
    </div>

    <button id="refreshBtn" onclick="loadData()">
        Aktualisieren
    </button>

</div>

<script>

let secondsLeft = 300;
let lastUpdate = "--:--";

function updateCountdown() {

    const min =
        String(Math.floor(secondsLeft / 60))
            .padStart(2, "0");

    const sec =
        String(secondsLeft % 60)
            .padStart(2, "0");

    document.getElementById("refreshInfo")
        .innerText =
        `Letzte Änderung: ${lastUpdate} | Refresh in ${min}:${sec}`;
}

async function loadData() {

    const btn =
        document.getElementById("refreshBtn");

    btn.disabled = true;
    btn.innerText = "Aktualisiere...";

    try {

        const response = await fetch(
            "avex-data.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        lastUpdate = data.updated;
        secondsLeft = 300;

        updateCountdown();

        document.getElementById("price").innerText =
            data.price + "€/kWh";

        const totalActive =
            data.free + data.occupied;
        
            let indicator = "🟢";
            let statusClass = "green";
            
            if (data.free <= 1) {
                indicator = "🔴";
                statusClass = "red";
            }
            else if (data.free <= 3) {
                indicator = "🟡";
                statusClass = "yellow";
            }
        
        let statusText =
            indicator + " " +
            data.free +
            " von " +
            totalActive +
            " Frei";
            document.title =
                indicator +
                " AVEX (" +
                data.free +
                "/" +
                totalActive +
                ")";

        if (data.offline > 0) {
            statusText +=
                " | ⚫ " + data.offline + " Offline";
        }

        document.getElementById("updated").innerHTML =
            `<span class="${statusClass}">${statusText}</span>`;

        btn.disabled = false;
        btn.innerText = "Aktualisieren";

    }
    catch(err) {

        document.getElementById("price").innerText =
            "FEHLER";
        
        document.getElementById("updated").innerText =
            err.stack || err.toString();

        btn.disabled = false;
        btn.innerText = "Aktualisieren";
    }
}

setInterval(() => {

    secondsLeft--;

    if (secondsLeft <= 0) {
        loadData();
        return;
    }

    updateCountdown();

}, 1000);

loadData();

</script>


</body>
</html>

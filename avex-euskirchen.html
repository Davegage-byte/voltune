<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AVEX Preis</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.box{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.price{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
}

.time{
    color:#999;
    margin-bottom:30px;
}

button{
    font-size:18px;
    padding:12px 24px;
    cursor:pointer;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

</style>

</head>
<body>

<div class="box">

    <h1>AVEX Euskirchen</h1>

    <div id="price" class="price">
        Lädt...
    </div>

    <div id="updated" class="time">
        Bitte warten...
    </div>

    <div id="refreshInfo" class="time">
        Stand: --:-- | Refresh in 05:00
    </div>

    <button id="refreshBtn" onclick="loadData()">
        Aktualisieren
    </button>

</div>

<script>

async function loadData() {

let secondsLeft = 300;
let countdownInterval;
let lastUpdate = "--:--";

    function updateCountdown() {

    const min =
        String(Math.floor(secondsLeft / 60))
            .padStart(2, "0");

    const sec =
        String(secondsLeft % 60)
            .padStart(2, "0");

    document.getElementById("refreshInfo")
        .innerText =
        `Stand: ${lastUpdate} | Refresh in ${min}:${sec}`;
    }
    
    const btn =
        document.getElementById("refreshBtn");

    btn.disabled = true;
    btn.innerText = "Aktualisiere...";

    document.getElementById("price").innerText =
        "Lädt...";

    document.getElementById("updated").innerText =
        "Bitte warten...";

    try {

        const response = await fetch(
            "avex-data.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();
        lastUpdate = data.updated;
        secondsLeft = 300;
        
        updateCountdown();

        document.getElementById("price").innerText =
            data.price + " €/kWh";

        let statusText =
            "🟢 " + data.free + " Frei | " +
            "🔴 " + data.occupied + " Belegt";
        
        if (data.offline > 0) {
            statusText +=
                " | ⚫ " + data.offline + " Offline";
        }
        
        document.getElementById("updated").innerHTML =
            statusText;

            btn.disabled = false;
            btn.innerText = "Aktualisieren";

    }
    catch(err) {

        document.getElementById("price").innerText =
            "Fehler";

        document.getElementById("updated").innerText =
            err.toString();

        btn.disabled = false;
        btn.innerText = "Aktualisieren";
    }
}

loadData();

let secondsLeft = 300;

setInterval(() => {

    secondsLeft--;

    const min =
        String(Math.floor(secondsLeft / 60))
            .padStart(2, "0");

    const sec =
        String(secondsLeft % 60)
            .padStart(2, "0");

    document.getElementById("refreshInfo")
        .innerText =
        `Stand: ${lastUpdate} | Refresh in ${min}:${sec}`;

    if (secondsLeft <= 0) {

        secondsLeft = 300;

        loadData();
    }

}, 1000);

</script>


</body>
</html>

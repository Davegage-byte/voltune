<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AVEX Preis</title>

<style>

h1 a {
    color: inherit;
    text-decoration: none;
}
    
.green {
    color: #00d26a;
}

.yellow {
    color: #ffd000;
}

.red {
    color: #ff4d4d;
}


body{
    margin:0;
    background:#111;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    padding:40px 0;
    box-sizing:border-box;
}

.box{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.price{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
}

.time{
    color:#999;
    margin-bottom:30px;
}

.chart-box {
    width:min(760px, 92vw);
    height:220px;
    margin:36px auto;
}

.chart-title {
    font-size:18px;
    font-weight:600;
    margin-bottom:12px;
}

.chart-current {
    font-weight:700;
}

.day-stats {
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    margin:0 auto 30px;
}

.day-stat {
    min-width:180px;
    padding:12px 18px;
    background:#191919;
    border:1px solid #303030;
    border-radius:12px;
}

.day-stat-label {
    color:#999;
    font-size:13px;
    margin-bottom:4px;
}

.day-stat-value {
    font-size:18px;
    font-weight:700;
}
    
button{
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:12px;

    padding:14px 28px;

    font-size:18px;
    font-weight:600;

    cursor:pointer;

    transition:all 0.2s ease;
}

button:hover{
    background:#333;
    border-color:#666;
}

button:active{
    transform:scale(0.97);
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

</style>

</head>
<body>

<div class="box">

    <h1>
        <a href="https://www.google.com/maps?q=50.686726020023045,6.838122769536388"
           target="_blank"
           rel="noopener noreferrer">
            AVEX Euskirchen
        </a>
    </h1>

    <div id="price" class="price">
        Lädt...
    </div>

    <div id="updated" class="time">
        Bitte warten...
    </div>

    <div id="sourceInfo" class="day-stats">
        <div class="day-stat">
            <div class="day-stat-label">Tagestief</div>
            <div id="dayLow" class="day-stat-value">--</div>
        </div>
        <div class="day-stat">
            <div class="day-stat-label">Tageshoch</div>
            <div id="dayHigh" class="day-stat-value">--</div>
        </div>
    </div>

    <div id="refreshInfo" class="time">
        Letzte Änderung: --:-- | Refresh in 05:00
    </div>

    <button id="refreshBtn" onclick="loadData()">
        Aktualisieren
    </button>

    <div class="chart-box">

    <div class="chart-title">
        24h-Preisverlauf · Aktuell <span id="chartCurrentPrice" class="chart-current">--</span>
    </div>

    <canvas id="priceChart"></canvas>

</div>

    <div style="margin-top:40px;">
    <h3>🚗 Tesla Fakt</h3>

    <div id="factText"
         style="max-width:600px;margin:15px auto;font-size:18px;">
        Lade Fakt...
    </div>

    <div id="progress"
         style="color:#999;margin-bottom:8px;">
    </div>

    <div id="level"
         style="margin-bottom:15px;">
    </div>

<button onclick="nextFact()">
    ⏭ Nächster Fakt
</button>

<button onclick="resetFacts()" style="margin-left:10px;">
    🔄 Reset
</button>
</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
<script>

let secondsLeft = 300;
let lastUpdate = "--:--";
let latestData = null;

let priceChart = null;

const priceClickPlugin = {

    id: "priceClickMarker",

    afterDatasetsDraw(chart) {

        const selected =
            chart.$selectedPrice;

        if (!selected) {
            return;
        }

        const ctx = chart.ctx;
        const area = chart.chartArea;

        const x =
            chart.scales.x.getPixelForValue(
                selected.time
            );

        const y =
            chart.scales.y.getPixelForValue(
                selected.price
            );


        ctx.save();


        // Senkrechte Markierung
        ctx.beginPath();
        ctx.moveTo(x, area.top);
        ctx.lineTo(x, area.bottom);

        ctx.strokeStyle =
            "rgba(255,255,255,0.45)";

        ctx.lineWidth = 1;

        ctx.stroke();


        // Punkt auf der Preislinie
        ctx.beginPath();

        ctx.arc(
            x,
            y,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";
        ctx.fill();


        const timeText =
            new Date(selected.time)
                .toLocaleTimeString(
                    "de-DE",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        const priceText =
            selected.price
                .toFixed(2)
                .replace(".", ",")
            + " €/kWh";

        const text =
            timeText + " | " + priceText;


        ctx.font =
            "600 14px Segoe UI, Arial";

        const padding = 8;

        const boxWidth =
            ctx.measureText(text).width
            + padding * 2;

        const boxHeight = 30;


        let boxX =
            x - boxWidth / 2;

        let boxY =
            y - boxHeight - 12;


        // Box im Diagramm halten
        if (boxX < area.left) {
            boxX = area.left;
        }

        if (
            boxX + boxWidth >
            area.right
        ) {
            boxX =
                area.right - boxWidth;
        }

        if (boxY < area.top) {
            boxY = y + 12;
        }


        ctx.fillStyle =
            "rgba(25,25,25,0.95)";

        ctx.fillRect(
            boxX,
            boxY,
            boxWidth,
            boxHeight
        );


        ctx.strokeStyle =
            "rgba(255,255,255,0.35)";

        ctx.strokeRect(
            boxX,
            boxY,
            boxWidth,
            boxHeight
        );


        ctx.fillStyle = "#ffffff";

        ctx.textBaseline = "middle";

        ctx.fillText(
            text,
            boxX + padding,
            boxY + boxHeight / 2
        );


        ctx.restore();
    }
};

const currentTimePlugin = {

    id: "currentTimeMarker",

    afterDatasetsDraw(chart) {

        const xScale = chart.scales.x;
        const area = chart.chartArea;
        const now = Date.now();

        if (!xScale || !area || now < xScale.min || now > xScale.max) {
            return;
        }

        const x = xScale.getPixelForValue(now);
        const ctx = chart.ctx;

        const timeText =
            new Date(now).toLocaleTimeString(
                "de-DE",
                {
                    timeZone: "Europe/Berlin",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        const text = "Jetzt " + timeText;

        ctx.save();

        ctx.beginPath();
        ctx.setLineDash([6, 5]);
        ctx.moveTo(x, area.top);
        ctx.lineTo(x, area.bottom);
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "600 12px Segoe UI, Arial";

        const paddingX = 7;
        const boxHeight = 24;
        const boxWidth = ctx.measureText(text).width + paddingX * 2;

        let boxX = x - boxWidth / 2;

        if (boxX < area.left) {
            boxX = area.left;
        }

        if (boxX + boxWidth > area.right) {
            boxX = area.right - boxWidth;
        }

        const boxY = area.top + 6;

        ctx.fillStyle = "rgba(17,17,17,0.92)";
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

        ctx.strokeStyle = "rgba(255,255,255,0.45)";
        ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

        ctx.fillStyle = "#ffffff";
        ctx.textBaseline = "middle";
        ctx.fillText(
            text,
            boxX + paddingX,
            boxY + boxHeight / 2
        );

        ctx.restore();
    }
};

async function loadPriceHistory() {

    try {
        if (!latestData) return;

        const schedule = (latestData.price_schedule || [])
            .map(entry => ({
                start: Date.parse(entry.valid_from),
                end: Date.parse(entry.valid_to),
                price: Number(entry.price)
            }))
            .filter(entry =>
                Number.isFinite(entry.start) &&
                Number.isFinite(entry.end) &&
                Number.isFinite(entry.price)
            )
            .sort((a, b) => a.start - b.start);

        if (!schedule.length) return;

        const berlinDay = date =>
            new Intl.DateTimeFormat("en-CA", {
                timeZone: "Europe/Berlin",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }).format(date);

        const today = berlinDay(new Date());

        const todayEntries = schedule.filter(entry =>
            berlinDay(new Date(entry.start)) === today ||
            berlinDay(new Date(entry.end - 1)) === today
        );

        if (!todayEntries.length) return;

        const dayStart = Math.min(...todayEntries.map(entry => entry.start));
        const dayEnd = Math.max(...todayEntries.map(entry => entry.end));

        const chartData = [];
        todayEntries.forEach(entry => {
            chartData.push({ x: entry.start, y: entry.price });
            chartData.push({ x: entry.end, y: entry.price });
        });

        const ctx = document.getElementById("priceChart").getContext("2d");

        if (priceChart) {
            priceChart.data.datasets[0].data = chartData;
            priceChart.options.scales.x.min = dayStart;
            priceChart.options.scales.x.max = dayEnd;
            priceChart.update();
            return;
        }

        priceChart = new Chart(ctx, {
            type: "line",
            plugins: [priceClickPlugin, currentTimePlugin],

            data: {
                datasets: [{
                    label: "Preis €/kWh",
                    data: chartData,
                    stepped: "before",
                    tension: 0,
                    borderWidth: 3,
                    pointRadius: 0,
                    pointHoverRadius: 5
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                parsing: false,

                onClick: function(event, elements, chart) {
                    const clickedTime = chart.scales.x.getValueForPixel(event.x);
                    const currentData = chart.data.datasets[0].data;
                    let clickedPrice = currentData[0].y;

                    for (const point of currentData) {
                        if (point.x <= clickedTime) clickedPrice = point.y;
                        else break;
                    }

                    chart.$selectedPrice = {
                        time: clickedTime,
                        price: clickedPrice
                    };
                    chart.draw();
                },

                plugins: {
                    legend: {
                        display: false
                    },

                    tooltip: {
                        callbacks: {
                            title: function(items) {
                                return new Date(items[0].parsed.x)
                                    .toLocaleTimeString("de-DE", {
                                        timeZone: "Europe/Berlin",
                                        hour: "2-digit",
                                        minute: "2-digit"
                                    });
                            },

                            label: function(context) {
                                return context.parsed.y
                                    .toFixed(2)
                                    .replace(".", ",") + " €/kWh";
                            }
                        }
                    }
                },

                scales: {
                    x: {
                        type: "linear",
                        min: dayStart,
                        max: dayEnd,
                        grid: {
                            color: "rgba(255,255,255,0.08)"
                        },
                        ticks: {
                            color: "#999",
                            maxTicksLimit: 7,
                            callback: function(value) {
                                return new Date(value)
                                    .toLocaleTimeString("de-DE", {
                                        timeZone: "Europe/Berlin",
                                        hour: "2-digit",
                                        minute: "2-digit"
                                    });
                            }
                        }
                    },

                    y: {
                        ticks: {
                            stepSize: 0.01,
                            color: "#999",
                            callback: function(value) {
                                return Number(value)
                                    .toFixed(2)
                                    .replace(".", ",") + " €";
                            }
                        },
                        grid: {
                            color: "rgba(255,255,255,0.08)"
                        }
                    }
                }
            }
        });

    }
    catch(err) {
        console.error("AVEX 24h-Preisverlauf konnte nicht geladen werden:", err);
    }
}

function updateCountdown() {

    const min =
        String(Math.floor(secondsLeft / 60))
            .padStart(2, "0");

    const sec =
        String(secondsLeft % 60)
            .padStart(2, "0");

    document.getElementById("refreshInfo")
        .innerText =
        `Letzter Abruf: ${lastUpdate} | Refresh in ${min}:${sec}`;
}

function renderLiveData() {
    if (!latestData) return;

    const data = latestData;
    const now = Date.now();
    const entries = (data.price_schedule || []).filter(entry =>
        Date.parse(entry.valid_from) <= now &&
        now < Date.parse(entry.valid_to) &&
        Number.isFinite(Number(entry.price))
    );

    const current = entries.length === 1 ? entries[0] : null;
    const price = current
        ? Number(current.price).toFixed(2).replace(".", ",")
        : data.price;

    document.getElementById("price").innerText = price + " €/kWh";

    const statusAge = now - Date.parse(data.status_published_at || "");
    const freshStatus = data.status_fresh && statusAge >= 0 && statusAge <= 30 * 60 * 1000;
    const knownCounts = [data.free, data.occupied, data.offline].every(Number.isInteger);
    const indicator = freshStatus
        ? (data.free <= 1 ? "🔴" : data.free <= 3 ? "🟡" : "🟢")
        : "⚪";

    let status = knownCounts
        ? `${indicator} ${data.free} von 8 frei | ${data.occupied} belegt | ${data.offline} offline`
        : "⚪ Belegung unbekannt";

    if (data.unknown) status += ` | ${data.unknown} unbekannt`;
    if (!freshStatus && knownCounts) status += " (nicht aktuell bestätigt)";
    document.getElementById("updated").innerText = status;

    const berlinDay = date =>
        new Intl.DateTimeFormat("en-CA", {
            timeZone: "Europe/Berlin",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).format(date);

    const today = berlinDay(new Date(now));
    const dayEntries = (data.price_schedule || [])
        .filter(entry =>
            Number.isFinite(Number(entry.price)) &&
            (
                berlinDay(new Date(entry.valid_from)) === today ||
                berlinDay(new Date(Date.parse(entry.valid_to) - 1)) === today
            )
        )
        .sort((a, b) => Date.parse(a.valid_from) - Date.parse(b.valid_from));

    const formatPrice = value =>
        Number(value).toFixed(2).replace(".", ",") + " €/kWh";

    const formatRange = entry => {
        const options = {
            timeZone: "Europe/Berlin",
            hour: "2-digit",
            minute: "2-digit"
        };

        const from = new Date(entry.valid_from)
            .toLocaleTimeString("de-DE", options);
        const to = new Date(entry.valid_to)
            .toLocaleTimeString("de-DE", options);

        return from + "–" + to + " Uhr";
    };

    if (dayEntries.length) {
        const minPrice = Math.min(...dayEntries.map(entry => Number(entry.price)));
        const maxPrice = Math.max(...dayEntries.map(entry => Number(entry.price)));
        const low = dayEntries.find(entry => Number(entry.price) === minPrice);
        const high = dayEntries.find(entry => Number(entry.price) === maxPrice);

        document.getElementById("dayLow").innerText =
            formatPrice(minPrice) + " · " + formatRange(low);

        document.getElementById("dayHigh").innerText =
            formatPrice(maxPrice) + " · " + formatRange(high);
    }
    else {
        document.getElementById("dayLow").innerText = "--";
        document.getElementById("dayHigh").innerText = "--";
    }

    document.getElementById("chartCurrentPrice").innerText =
        price + " €/kWh";

    if (priceChart) {
        priceChart.draw();
    }

    document.title =
        `${indicator} ${price} €/kWh | AVEX Euskirchen`;
}

async function loadData() {

    const btn =
        document.getElementById("refreshBtn");

    btn.disabled = true;
    btn.innerText = "Aktualisiere...";

    try {

        const response = await fetch(
            "avex-data.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        latestData = data;
        lastUpdate = data.checked_at
            ? new Date(data.checked_at).toLocaleString("de-DE", {timeZone: "Europe/Berlin"})
            : data.updated;
        secondsLeft = 300;
        updateCountdown();
        renderLiveData();

        await loadPriceHistory();
        
        btn.disabled = false;
        btn.innerText = "Aktualisieren";

    }
    catch(err) {

        document.getElementById("price").innerText =
            "FEHLER";
        
        document.getElementById("updated").innerText =
            err.stack || err.toString();

        btn.disabled = false;
        btn.innerText = "Aktualisieren";
    }
}

setInterval(() => {

    renderLiveData();
    secondsLeft--;

    if (secondsLeft <= 0) {
        loadData();
        return;
    }

    updateCountdown();

}, 1000);

let facts = [];

let seenFacts =
    JSON.parse(
        localStorage.getItem("seenFacts") || "[]"
    );

async function loadFacts() {

    const response =
        await fetch("facts.json");

    facts =
        await response.json();

    showNextUnseenFact();
}

function getLevel(count) {

    if (count >= 100) return "👑 Tesla Legende";
    if (count >= 90) return "🌟 Tesla Guru";
    if (count >= 75) return "🚀 Tesla Experte";
    if (count >= 60) return "🏆 Tesla Nerd";
    if (count >= 40) return "🔋 Akku-Profi";
    if (count >= 25) return "⚡ Supercharger Rookie";
    if (count >= 10) return "🚗 Tesla Fan";

    return "🔰 Tesla Anfänger";
}

function updateFactStats() {

    document.getElementById("progress").innerHTML =
        `📚 Gelesen: ${seenFacts.length}`;

    document.getElementById("level").innerHTML =
        `🏆 ${getLevel(seenFacts.length)}`;
}

function showNextUnseenFact() {

    let available =
        facts.filter(
            f => !seenFacts.includes(f.id)
        );

    if (available.length === 0) {
    
        document.getElementById("factText").innerHTML =
            `🎉 Du hast alle Fakten gelesen!<br><br>
             <button onclick="resetFacts()">
                 🔄 Von vorne beginnen
             </button>`;
    
        updateFactStats();
    
        return;
    }


    const fact =
        available[
            Math.floor(
                Math.random() * available.length
            )
        ];

    document.getElementById("factText").innerHTML =
        fact.text;

    seenFacts.push(fact.id);

    localStorage.setItem(
        "seenFacts",
        JSON.stringify(seenFacts)
    );

    updateFactStats();
}

function resetFacts() {

    if (!confirm("Fortschritt wirklich komplett zurücksetzen?")) {
        return;
    }

    localStorage.removeItem("seenFacts");

    seenFacts = [];

    showNextUnseenFact();
}
    
function nextFact() {
    showNextUnseenFact();
}
    
loadData();
loadFacts();
    
</script>


</body>
</html>

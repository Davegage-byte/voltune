<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AVEX Preis</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.box{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.price{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
}

.time{
    color:#999;
    margin-bottom:30px;
}

button{
    font-size:18px;
    padding:12px 24px;
    cursor:pointer;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

</style>

</head>
<body>

<div class="box">

    <h1>AVEX Euskirchen</h1>

    <div id="price" class="price">
        Lädt...
    </div>

    <div id="updated" class="time">
        Bitte warten...
    </div>

    <button onclick="loadData()">
        Aktualisieren
    </button>

</div>

<script>

async function loadData() {

    document.getElementById("price").innerText =
        "Lädt...";

    document.getElementById("updated").innerText =
        "Bitte warten...";

    try {

        const response = await fetch(
            "avex-data.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        document.getElementById("price").innerText =
            data.price + " €/kWh";

        document.getElementById("updated").innerHTML =
            "🟢 " + data.free + " Frei | " +
            "🔴 " + data.occupied + " Belegt | " +
            "⚫ " + data.offline + " Offline" +
            "<br><br>🕒 Aktualisiert: " +
            data.updated;

    }
    catch(err) {

        document.getElementById("price").innerText =
            "Fehler";

        document.getElementById("updated").innerText =
            err.toString();
    }
}

loadData();

</script>


</body>
</html>

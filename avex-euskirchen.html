<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AVEX Preis</title>

<style>

h1 a {
    color: inherit;
    text-decoration: none;
}
    
.green {
    color: #00d26a;
}

.yellow {
    color: #ffd000;
}

.red {
    color: #ff4d4d;
}


body{
    margin:0;
    background:#111;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    padding:40px 0;
    box-sizing:border-box;
}

.box{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.price{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
}

.time{
    color:#999;
    margin-bottom:30px;
}

.chart-box {
    width: min(900px, 92vw);
    height: 300px;
    margin: 40px auto;
}

.chart-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 15px;
}
    
button{
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:12px;

    padding:14px 28px;

    font-size:18px;
    font-weight:600;

    cursor:pointer;

    transition:all 0.2s ease;
}

button:hover{
    background:#333;
    border-color:#666;
}

button:active{
    transform:scale(0.97);
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

</style>

</head>
<body>

<div class="box">

    <h1>
        <a href="https://www.google.com/maps?q=50.686726020023045,6.838122769536388"
           target="_blank"
           rel="noopener noreferrer">
            AVEX Euskirchen
        </a>
    </h1>

    <div id="price" class="price">
        Lädt...
    </div>

    <div id="updated" class="time">
        Bitte warten...
    </div>

    <div id="refreshInfo" class="time">
        Letzte Änderung: --:-- | Refresh in 05:00
    </div>

    <button id="refreshBtn" onclick="loadData()">
        Aktualisieren
    </button>

    <div class="chart-box">

    <div class="chart-title">
        Preisverlauf letzte 24 Stunden
    </div>

    <canvas id="priceChart"></canvas>

</div>

    <div style="margin-top:40px;">
    <h3>🚗 Tesla Fakt</h3>

    <div id="factText"
         style="max-width:600px;margin:15px auto;font-size:18px;">
        Lade Fakt...
    </div>

    <div id="progress"
         style="color:#999;margin-bottom:8px;">
    </div>

    <div id="level"
         style="margin-bottom:15px;">
    </div>

<button onclick="nextFact()">
    ⏭ Nächster Fakt
</button>

<button onclick="resetFacts()" style="margin-left:10px;">
    🔄 Reset
</button>
</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
<script>

let secondsLeft = 300;
let lastUpdate = "--:--";

let priceChart = null;

async function loadPriceHistory() {

    try {

        const response = await fetch(
            "avex-history.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "History HTTP " + response.status
            );
        }

        const history =
            await response.json();

        if (!history.length) {
            return;
        }


        const now = Date.now();

        const start =
            now - (24 * 60 * 60 * 1000);


        const parsed =
            history
                .map(point => ({
                    x: new Date(point.time).getTime(),
                    y: Number(point.price)
                }))
                .sort((a, b) => a.x - b.x);


        /*
         * Preis ermitteln, der exakt am Anfang
         * des 24h-Fensters gültig war.
         */
        let startPrice = parsed[0].y;

        for (const point of parsed) {

            if (point.x <= start) {
                startPrice = point.y;
            }
            else {
                break;
            }
        }


        /*
         * Nur echte Preisänderungen innerhalb
         * der letzten 24 Stunden übernehmen.
         */
        const visiblePoints =
            parsed.filter(
                point => point.x > start
            );


        /*
         * Künstlicher Startpunkt:
         * genau vor 24 Stunden.
         */
        const chartData = [
            {
                x: start,
                y: startPrice
            },
            ...visiblePoints
        ];


        /*
         * Linie bis zum aktuellen Zeitpunkt
         * verlängern.
         */
        const latestPrice =
            chartData[
                chartData.length - 1
            ].y;

        chartData.push({
            x: now,
            y: latestPrice
        });


        const ctx =
            document
                .getElementById("priceChart")
                .getContext("2d");


        if (priceChart) {

            priceChart.data.datasets[0].data =
                chartData;

            priceChart.options.scales.x.min =
                start;

            priceChart.options.scales.x.max =
                now;

            priceChart.update();

            return;
        }


        priceChart =
            new Chart(ctx, {

                type: "line",

                data: {
                    datasets: [{
                        label: "Preis €/kWh",
                        data: chartData,

                        /*
                         * Harte Preisstufen:
                         * KEINE Glättung.
                         */
                        stepped: "after",
                        tension: 0,

                        borderWidth: 3,
                        pointRadius: 0,
                        pointHoverRadius: 5
                    }]
                },

                options: {

                    responsive: true,
                    maintainAspectRatio: false,

                    animation: false,

                    parsing: false,

                    plugins: {

                        legend: {
                            display: false
                        },

                        tooltip: {

                            callbacks: {

                                title: function(items) {

                                    const date =
                                        new Date(
                                            items[0].parsed.x
                                        );

                                    return date
                                        .toLocaleString(
                                            "de-DE",
                                            {
                                                hour: "2-digit",
                                                minute: "2-digit"
                                            }
                                        );
                                },

                                label: function(context) {

                                    return (
                                        context.parsed.y
                                            .toFixed(2)
                                            .replace(".", ",")
                                        + " €/kWh"
                                    );
                                }
                            }
                        }
                    },

                    scales: {

                        x: {

                            type: "linear",

                            min: start,
                            max: now,

                            grid: {
                                color:
                                    "rgba(255,255,255,0.08)"
                            },

                            ticks: {

                                color: "#999",

                                maxTicksLimit: 7,

                                callback: function(value) {

                                    const date =
                                        new Date(value);

                                    return date
                                        .toLocaleTimeString(
                                            "de-DE",
                                            {
                                                hour: "2-digit",
                                                minute: "2-digit"
                                            }
                                        );
                                }
                            }
                        },

                        y: {
                        
                            ticks: {
                                stepSize: 0.01,
                        
                                color: "#999",
                        
                                callback: function(value) {
                        
                                    return (
                                        Number(value)
                                            .toFixed(2)
                                            .replace(".", ",")
                                        + " €"
                                    );
                                }
                            },
                        
                            grid: {
                                color:
                                    "rgba(255,255,255,0.08)"
                            }
                        }
                    }
                }
            });

    }
    catch(err) {

        console.error(
            "AVEX Preisverlauf konnte nicht geladen werden:",
            err
        );
    }
}

function updateCountdown() {

    const min =
        String(Math.floor(secondsLeft / 60))
            .padStart(2, "0");

    const sec =
        String(secondsLeft % 60)
            .padStart(2, "0");

    document.getElementById("refreshInfo")
        .innerText =
        `Letzte Änderung: ${lastUpdate} | Refresh in ${min}:${sec}`;
}

async function loadData() {

    const btn =
        document.getElementById("refreshBtn");

    btn.disabled = true;
    btn.innerText = "Aktualisiere...";

    try {

        const response = await fetch(
            "avex-data.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        lastUpdate = data.updated;
        secondsLeft = 300;

        updateCountdown();

        document.getElementById("price").innerText =
            data.price + "€/kWh";

        const totalActive =
            data.free + data.occupied;
        
            let indicator = "🟢";
            let statusClass = "green";
            
            if (data.free <= 1) {
                indicator = "🔴";
                statusClass = "red";
            }
            else if (data.free <= 3) {
                indicator = "🟡";
                statusClass = "yellow";
            }
        
        let statusText =
            indicator + " " +
            data.free +
            " von " +
            totalActive +
            " Frei";
                document.title =
                    indicator +
                    " (" +
                    data.free +
                    "/" +
                    totalActive +
                    ") | " +
                    data.price +
                    "€/kWh";

        if (data.offline > 0) {
            statusText +=
                " | ⚫ " + data.offline + " Offline";
        }

        document.getElementById("updated").innerHTML =
            `<span class="${statusClass}">${statusText}</span>`;

        await loadPriceHistory();
        
        btn.disabled = false;
        btn.innerText = "Aktualisieren";

    }
    catch(err) {

        document.getElementById("price").innerText =
            "FEHLER";
        
        document.getElementById("updated").innerText =
            err.stack || err.toString();

        btn.disabled = false;
        btn.innerText = "Aktualisieren";
    }
}

setInterval(() => {

    secondsLeft--;

    if (secondsLeft <= 0) {
        loadData();
        return;
    }

    updateCountdown();

}, 1000);

let facts = [];

let seenFacts =
    JSON.parse(
        localStorage.getItem("seenFacts") || "[]"
    );

async function loadFacts() {

    const response =
        await fetch("facts.json");

    facts =
        await response.json();

    showNextUnseenFact();
}

function getLevel(count) {

    if (count >= 100) return "👑 Tesla Legende";
    if (count >= 90) return "🌟 Tesla Guru";
    if (count >= 75) return "🚀 Tesla Experte";
    if (count >= 60) return "🏆 Tesla Nerd";
    if (count >= 40) return "🔋 Akku-Profi";
    if (count >= 25) return "⚡ Supercharger Rookie";
    if (count >= 10) return "🚗 Tesla Fan";

    return "🔰 Tesla Anfänger";
}

function updateFactStats() {

    document.getElementById("progress").innerHTML =
        `📚 Gelesen: ${seenFacts.length}`;

    document.getElementById("level").innerHTML =
        `🏆 ${getLevel(seenFacts.length)}`;
}

function showNextUnseenFact() {

    let available =
        facts.filter(
            f => !seenFacts.includes(f.id)
        );

    if (available.length === 0) {
    
        document.getElementById("factText").innerHTML =
            `🎉 Du hast alle Fakten gelesen!<br><br>
             <button onclick="resetFacts()">
                 🔄 Von vorne beginnen
             </button>`;
    
        updateFactStats();
    
        return;
    }


    const fact =
        available[
            Math.floor(
                Math.random() * available.length
            )
        ];

    document.getElementById("factText").innerHTML =
        fact.text;

    seenFacts.push(fact.id);

    localStorage.setItem(
        "seenFacts",
        JSON.stringify(seenFacts)
    );

    updateFactStats();
}

function resetFacts() {

    if (!confirm("Fortschritt wirklich komplett zurücksetzen?")) {
        return;
    }

    localStorage.removeItem("seenFacts");

    seenFacts = [];

    showNextUnseenFact();
}
    
function nextFact() {
    showNextUnseenFact();
}
    
loadData();
loadFacts();
    
</script>


</body>
</html>

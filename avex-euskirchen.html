<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AVEX Preis</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.box{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.price{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
}

.time{
    color:#999;
    margin-bottom:30px;
}

button{
    font-size:18px;
    padding:12px 24px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="box">

    <h1>AVEX Euskirchen</h1>

    <div id="price" class="price">
        Lädt...
    </div>

    <div id="updated" class="time">
        Bitte warten...
    </div>

    <button onclick="loadData()">
        Aktualisieren
    </button>

</div>

<script>

async function loadData() {

    try {

        const response = await fetch(
            "https://r.jina.ai/http://ladestatistik.de/euskirchen/avex-mineraloelhandelsgesellschaft/"
        );

        const html = await response.text();

        // Preis
        const priceMatch =
            html.match(/([0-9],[0-9]{2})\s*€\/kWh/i);

        document.getElementById("price").innerText =
            priceMatch
                ? priceMatch[1] + " €/kWh"
                : "Preis nicht gefunden";

        // Frei
        const freeMatch =
            html.match(/(\d+)\s+aktuell\s+frei/i);

        // Belegt
        const occupiedMatch =
            html.match(/aktuell\s+belegt\s+(\d+)/i);

        const free =
            parseInt(freeMatch?.[1] || 0);

        const occupied =
            parseInt(occupiedMatch?.[1] || 0);

        // AVEX Euskirchen hat 8 Ladepunkte
        const offline =
            Math.max(
                0,
                8 - free - occupied
            );

        document.getElementById("updated").innerText =
            "🟢 " + free + " Frei | " +
            "🔴 " + occupied + " Belegt | " +
            "⚫ " + offline + " Offline";

    }
    catch(err) {

        document.getElementById("price").innerText =
            "Fehler";

        document.getElementById("updated").innerText =
            "🔴 Daten konnten nicht geladen werden";
    }
}

loadData();

</script>

</body>
</html>

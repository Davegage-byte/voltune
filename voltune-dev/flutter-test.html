<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voltune – Big Turbo Air Lab</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05070a;
      color: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #172235 0, #070a0f 45%, #040609 100%);
    }

    main {
      width: min(880px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
    }

    .lead {
      margin: 8px 0 22px;
      color: #a8b3c1;
      line-height: 1.5;
      max-width: 760px;
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 14px;
      border: 1px solid #283240;
      border-radius: 14px;
      background: rgba(15, 20, 29, .82);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      min-height: 92px;
      padding: 15px 16px;
      border: 1px solid #2b3644;
      border-radius: 14px;
      background: rgba(18, 25, 35, .94);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    button:active {
      transform: scale(.988);
    }

    button strong {
      display: block;
      margin-bottom: 5px;
      font-size: 17px;
    }

    button small {
      color: #9aa7b7;
      line-height: 1.35;
    }

    #status {
      margin-top: 20px;
      min-height: 24px;
      color: #cbd4df;
    }

    .note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #202936;
      color: #8793a4;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 680px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<main>
  <h1>Big Turbo Air Lab</h1>

  <p class="lead">
    Basis: Big Turbo + hohes Turbo-Pfeifen. Neu ist ein deutlich stärkerer
    Luft-/Zisch-Layer aus gefiltertem weißem Rauschen.
  </p>

  <div class="controls">
    <label for="volume">Test-Lautstärke</label>
    <input id="volume" type="range" min="10" max="100" value="70">
    <span id="volumeLabel">70 %</span>
  </div>

  <div class="grid">
    <button data-v="1"><strong>1 · Balanced Air</strong><small>Big Turbo + Pfeifen + deutlich mehr Luft</small></button>
    <button data-v="2"><strong>2 · Air Heavy</strong><small>Sehr viel Zischen, Flutter etwas weiter hinten</small></button>
    <button data-v="3"><strong>3 · Whistle Heavy</strong><small>Mehr Pfeifen, Luft bleibt kräftig darunter</small></button>
    <button data-v="4"><strong>4 · Big Valve</strong><small>Tiefe große Flutter-Stöße mit breitem Luftschwall</small></button>
    <button data-v="5"><strong>5 · Fast Air Chatter</strong><small>Big-Turbo-Körper, aber schnelleres Luftflattern</small></button>
    <button data-v="6"><strong>6 · Pressure Release</strong><small>Erst großer Luftstoß, dann Flutter-Serie</small></button>
    <button data-v="7"><strong>7 · Long Air Tail</strong><small>Flutter mit langem rauschendem Ausatmen</small></button>
    <button data-v="8"><strong>8 · Sharp Valve</strong><small>Helleres Zischen und klarere Ventilimpulse</small></button>
    <button data-v="9"><strong>9 · Huge Turbo</strong><small>Langsam, tief, massiv, viel Luftvolumen</small></button>
    <button data-v="10"><strong>10 · Maximum JDM Air</strong><small>Pfeifen, Luft und großes Flutter bewusst übertrieben</small></button>
  </div>

  <div id="status">Bereit.</div>

  <div class="note">
    Ziel ist diesmal nicht nur das Flutter selbst, sondern das Gefühl von
    komprimierter Luft, die hörbar durch Ventil und Verdichter entweicht.
  </div>
</main>

<script>
(() => {
  let ctx = null;
  let master = null;
  let noiseBuffer = null;

  const volume = document.getElementById("volume");
  const volumeLabel = document.getElementById("volumeLabel");
  const status = document.getElementById("status");

  function createNoiseBuffer(seconds = 2) {
    const length = Math.floor(ctx.sampleRate * seconds);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    return buffer;
  }

  async function ensureAudio() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();

      master = ctx.createGain();
      master.gain.value = 0.72;

      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -1;
      limiter.knee.value = 0;
      limiter.ratio.value = 12;
      limiter.attack.value = 0.001;
      limiter.release.value = 0.08;

      master.connect(limiter).connect(ctx.destination);
      noiseBuffer = createNoiseBuffer();
    }

    if (ctx.state === "suspended") {
      await ctx.resume();
    }
  }

  function level() {
    return Number(volume.value) / 100;
  }

  function noiseLayer({
    time,
    duration,
    gain,
    hp = 500,
    bp = 2600,
    q = 0.6,
    sweepTo = null,
    attack = 0.004,
    sustain = 0.45
  }) {
    const source = ctx.createBufferSource();
    source.buffer = noiseBuffer;

    const highpass = ctx.createBiquadFilter();
    highpass.type = "highpass";
    highpass.frequency.value = hp;

    const bandpass = ctx.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.Q.value = q;
    bandpass.frequency.setValueAtTime(bp, time);

    if (sweepTo) {
      bandpass.frequency.exponentialRampToValueAtTime(
        sweepTo,
        time + duration
      );
    }

    const g = ctx.createGain();
    const peak = Math.max(0.0002, gain * level());

    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(
      peak,
      time + attack
    );
    g.gain.exponentialRampToValueAtTime(
      peak * 0.68,
      time + duration * sustain
    );
    g.gain.exponentialRampToValueAtTime(
      0.0001,
      time + duration
    );

    source
      .connect(highpass)
      .connect(bandpass)
      .connect(g)
      .connect(master);

    source.start(time);
    source.stop(time + duration + 0.03);
  }

  function whistle({
    time,
    duration,
    startHz,
    endHz,
    gain
  }) {
    const osc = ctx.createOscillator();
    osc.type = "sine";

    osc.frequency.setValueAtTime(startHz, time);
    osc.frequency.exponentialRampToValueAtTime(
      endHz,
      time + duration
    );

    const g = ctx.createGain();
    const peak = Math.max(0.0002, gain * level());

    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(
      peak,
      time + 0.006
    );
    g.gain.exponentialRampToValueAtTime(
      peak * 0.55,
      time + duration * 0.55
    );
    g.gain.exponentialRampToValueAtTime(
      0.0001,
      time + duration
    );

    osc.connect(g).connect(master);
    osc.start(time);
    osc.stop(time + duration + 0.03);
  }

  function flutter({
    start,
    offsets,
    durations,
    freqs,
    ends,
    gains,
    airGains,
    qs
  }) {
    offsets.forEach((offset, i) => {
      const t = start + offset;

      noiseLayer({
        time: t,
        duration: durations[i],
        gain: airGains[i],
        hp: 420,
        bp: freqs[i],
        q: qs?.[i] ?? 0.8,
        sweepTo: ends[i],
        sustain: 0.38
      });

      whistle({
        time: t,
        duration: durations[i],
        startHz: freqs[i] * 0.92,
        endHz: ends[i] * 0.78,
        gain: gains[i]
      });
    });
  }

  function playVariant(v) {
    const now = ctx.currentTime + 0.03;

    switch (v) {
      case 1:
        whistle({time:now,duration:.16,startHz:4300,endHz:3150,gain:.035});
        noiseLayer({time:now,duration:.18,gain:.12,hp:650,bp:4200,q:.55,sweepTo:2500});
        flutter({
          start:now+.08,
          offsets:[0,.13,.28,.45],
          durations:[.10,.11,.13,.20],
          freqs:[2200,1900,1600,1350],
          ends:[1450,1200,950,700],
          gains:[.018,.016,.014,.012],
          airGains:[.17,.155,.14,.125]
        });
        break;

      case 2:
        noiseLayer({time:now,duration:.25,gain:.20,hp:500,bp:3600,q:.45,sweepTo:1500});
        whistle({time:now,duration:.14,startHz:4200,endHz:3000,gain:.025});
        flutter({
          start:now+.10,
          offsets:[0,.14,.30,.48],
          durations:[.11,.12,.14,.22],
          freqs:[2100,1800,1500,1250],
          ends:[1350,1100,850,620],
          gains:[.013,.012,.011,.010],
          airGains:[.20,.18,.16,.145]
        });
        break;

      case 3:
        whistle({time:now,duration:.20,startHz:4700,endHz:3150,gain:.050});
        noiseLayer({time:now,duration:.20,gain:.13,hp:700,bp:4300,q:.55,sweepTo:2400});
        flutter({
          start:now+.10,
          offsets:[0,.13,.28,.45],
          durations:[.09,.10,.12,.18],
          freqs:[2300,1950,1650,1400],
          ends:[1500,1250,980,720],
          gains:[.022,.019,.016,.014],
          airGains:[.16,.145,.13,.115]
        });
        break;

      case 4:
        noiseLayer({time:now,duration:.16,gain:.15,hp:380,bp:2900,q:.5,sweepTo:1700});
        whistle({time:now,duration:.14,startHz:4100,endHz:2950,gain:.028});
        flutter({
          start:now+.085,
          offsets:[0,.16,.34,.55],
          durations:[.13,.14,.16,.24],
          freqs:[1900,1650,1400,1180],
          ends:[1200,1000,800,580],
          gains:[.015,.013,.012,.010],
          airGains:[.22,.20,.18,.16],
          qs:[.6,.6,.55,.5]
        });
        break;

      case 5:
        whistle({time:now,duration:.12,startHz:4500,endHz:3300,gain:.032});
        noiseLayer({time:now,duration:.13,gain:.13,hp:650,bp:4100,q:.55,sweepTo:2700});
        flutter({
          start:now+.07,
          offsets:[0,.075,.155,.24,.33,.43],
          durations:[.055,.06,.065,.07,.08,.12],
          freqs:[2450,2250,2050,1850,1650,1450],
          ends:[1750,1600,1450,1280,1100,850],
          gains:[.016,.015,.014,.013,.012,.011],
          airGains:[.16,.15,.14,.13,.12,.11]
        });
        break;

      case 6:
        whistle({time:now,duration:.18,startHz:4400,endHz:3000,gain:.032});
        noiseLayer({time:now,duration:.30,gain:.22,hp:500,bp:3900,q:.45,sweepTo:1300,sustain:.58});
        flutter({
          start:now+.17,
          offsets:[0,.14,.30,.48],
          durations:[.09,.11,.13,.20],
          freqs:[2100,1800,1500,1250],
          ends:[1350,1100,850,620],
          gains:[.014,.013,.012,.010],
          airGains:[.15,.14,.13,.12]
        });
        break;

      case 7:
        whistle({time:now,duration:.15,startHz:4300,endHz:3100,gain:.031});
        noiseLayer({time:now,duration:.17,gain:.13,hp:600,bp:4100,q:.55,sweepTo:2500});
        flutter({
          start:now+.08,
          offsets:[0,.13,.28,.46],
          durations:[.10,.11,.13,.30],
          freqs:[2200,1900,1600,1350],
          ends:[1450,1200,950,600],
          gains:[.016,.014,.012,.010],
          airGains:[.17,.155,.14,.16]
        });
        noiseLayer({time:now+.48,duration:.36,gain:.11,hp:450,bp:1900,q:.45,sweepTo:850,sustain:.42});
        break;

      case 8:
        whistle({time:now,duration:.14,startHz:4900,endHz:3500,gain:.038});
        noiseLayer({time:now,duration:.15,gain:.15,hp:900,bp:5200,q:.7,sweepTo:3100});
        flutter({
          start:now+.075,
          offsets:[0,.105,.225,.365],
          durations:[.075,.085,.10,.16],
          freqs:[3100,2700,2300,1950],
          ends:[2200,1900,1550,1100],
          gains:[.018,.016,.014,.012],
          airGains:[.16,.15,.135,.12],
          qs:[1.0,.95,.9,.8]
        });
        break;

      case 9:
        whistle({time:now,duration:.20,startHz:4100,endHz:2850,gain:.030});
        noiseLayer({time:now,duration:.28,gain:.20,hp:350,bp:3200,q:.45,sweepTo:1200});
        flutter({
          start:now+.14,
          offsets:[0,.18,.39,.64],
          durations:[.14,.16,.18,.28],
          freqs:[1800,1550,1320,1120],
          ends:[1100,900,720,520],
          gains:[.014,.012,.011,.009],
          airGains:[.23,.21,.19,.17],
          qs:[.55,.55,.5,.45]
        });
        break;

      case 10:
        whistle({time:now,duration:.22,startHz:4800,endHz:3000,gain:.045});
        noiseLayer({time:now,duration:.26,gain:.23,hp:600,bp:4700,q:.5,sweepTo:1600});
        flutter({
          start:now+.10,
          offsets:[0,.10,.215,.345,.50],
          durations:[.08,.09,.105,.13,.24],
          freqs:[2700,2350,2000,1700,1400],
          ends:[1900,1650,1350,1050,650],
          gains:[.020,.018,.016,.014,.012],
          airGains:[.20,.19,.175,.16,.15],
          qs:[.8,.75,.7,.65,.55]
        });
        noiseLayer({time:now+.50,duration:.30,gain:.12,hp:450,bp:2100,q:.5,sweepTo:800});
        break;
    }
  }

  volume.addEventListener("input", () => {
    volumeLabel.textContent = `${volume.value} %`;
  });

  document.querySelectorAll("[data-v]").forEach(button => {
    button.addEventListener("click", async () => {
      await ensureAudio();
      const v = Number(button.dataset.v);
      status.textContent = `Spiele Variante ${v} …`;
      playVariant(v);

      setTimeout(() => {
        status.textContent = `Variante ${v} gespielt.`;
      }, 1100);
    });
  });
})();
</script>
</body>
</html>
